<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial}button{padding:8px;border:0;border-radius:4px}[data-button-role=primary]{background:#007a5a;color:#fff}[data-button-role=danger]{background:#e01e5a;color:#fff}[data-button-role=secondary]{background:#1264a3;color:#fff}.hidden{display:none!important}#sidebar{background:#3f0f3f;color:white;width:240px;padding:15px}.layout{display:flex;height:100vh}.content{flex:1;padding:15px}.thread{width:330px;border-left:1px solid #ddd;padding:15px}.message{padding:12px;border-bottom:1px solid #ddd}.modal{padding:15px;border:1px solid #aaa}
</style></head><body><div id="auth-modal"><form data-testid="auth-form" data-mode="login"><input name="username"><input name="password" type="password"><input name="display_name" placeholder="Display name"><button type="submit" data-testid="auth-submit" data-button-role="primary">Log in</button></form><button data-testid="auth-toggle" data-button-role="secondary">Sign up</button><div data-testid="auth-error"></div></div>
<div id="shell" class="hidden"><div class="layout"><aside id="sidebar" data-testid="sidebar"><b data-testid="workspace-header">Huddle</b><span data-testid="current-user"></span><button data-testid="logout-btn" data-button-role="danger">Logout</button><button data-testid="new-channel-btn" data-button-role="secondary">New channel</button><button data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><div data-testid="channel-list"></div><div data-testid="dms-list"></div><form data-testid="workspace-create-form" style="display:block"><input name="slug"><input name="name"><button type="submit" data-testid="workspace-general-submit" data-button-role="primary">Create workspace</button></form><button data-testid="empty-state-create-workspace">Create workspace</button><form data-testid="join-workspace-form"><input name="slug"><button data-testid="join-workspace-submit" data-button-role="primary">Join</button></form><div data-testid="join-workspace-error"></div></aside><section class="content"><h2 data-testid="channel-title">#general</h2><div data-testid="channel-topic"></div><button data-testid="channel-settings-btn" data-button-role="secondary">Settings</button><div data-testid="message-list"></div><input data-testid="message-input"><button data-testid="send-btn" data-button-role="primary">Send</button></section><aside data-testid="thread-panel" class="thread hidden"><button data-testid="close-thread" data-button-role="secondary">Close</button><div id="thread-content"></div><input data-testid="thread-input"><button data-testid="thread-send" data-button-role="primary">Reply</button></aside></div></div>
<div id="create-channel-modal" class="modal hidden"><form data-testid="create-channel-form"><input name="name"><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"><button data-testid="create-channel-submit" data-button-role="primary">Create</button><button data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button><div data-testid="create-channel-error"></div></form></div>
<div id="channel-settings-modal" class="modal hidden"><h3 data-testid="channel-settings-title">Channel</h3><button data-testid="channel-settings-close" data-button-role="secondary">Close</button><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary">Add</button></form><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary">Save</button><button data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button></div>
<div id="workspace-settings-modal" class="modal hidden"><button data-testid="workspace-settings-close" data-button-role="secondary">Close</button><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button data-testid="settings-tab-members">Members</button><button data-testid="settings-tab-invitations">Invitations</button><button data-testid="settings-tab-general">General</button><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div><button data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button data-testid="create-invitation-submit" data-button-role="primary">Create</button></form><div data-testid="invitations-list"></div></div>
<script>
let token=localStorage.getItem('huddle.token'),current=null,user=null,workspace=null,currentChannel=null,signup=false;const $=s=>document.querySelector(s);const api=async(u,o={})=>{o.headers=Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+token},o.headers||{});let r=await fetch('/api'+u,o);let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'error');return j};
async function boot(){if(!token){$('#auth-modal').classList.remove('hidden');$('#shell').classList.add('hidden');return}try{user=(await api('/auth/me')).user;$('#auth-modal').classList.add('hidden');$('#shell').classList.remove('hidden');$('[data-testid=current-user]').textContent=user.display_name;let q=await api('/workspaces');if(q.workspaces[0]){workspace=q.workspaces[0];$('[data-testid=workspace-header]').textContent=workspace.name;let d=await api('/workspaces/'+workspace.slug);let list=$('[data-testid=channel-list]');list.innerHTML=d.channels.map(c=>`<div data-testid="channel-entry" data-channel-id="${c.id}" data-channel-name="${c.name}">#${c.name}</div>`).join('');list.querySelectorAll('[data-channel-entry], [data-testid=channel-entry]').forEach(x=>x.onclick=()=>select(x.dataset.channelId));if(d.channels[0])select(d.channels[0].id)}}catch(e){localStorage.removeItem('huddle.token');token=null;boot()}}
async function select(id){current=id;let d=await api('/channels/'+id);currentChannel=d.channel;let q=await api('/channels/'+id+'/messages');$('[data-testid=channel-title]').textContent=currentChannel.name;$('[data-testid=channel-topic]').textContent=currentChannel.topic||'';let el=$('[data-testid=message-list]');el.innerHTML='';if(!q.messages.length){el.innerHTML='<div data-testid="empty-channel">No messages yet. Say hello!</div>';return}q.messages.reverse().forEach(m=>{let row=document.createElement('div');row.dataset.testid='message';row.dataset.messageId=m.id;row.className='message';row.innerHTML='<span data-testid="message-avatar">'+m.author.display_name[0]+'</span> <b data-testid="message-author">'+m.author.display_name+'</b> <span data-testid="message-time" title="'+m.created_at+'">'+new Date(m.created_at).toLocaleTimeString()+'</span><div data-testid="message-body">'+m.body+'</div><button data-testid="open-thread-btn">Thread</button><button data-testid="reaction-button">React</button>';el.appendChild(row)})}
$('[data-testid=auth-toggle]').onclick=()=>{signup=!signup;let f=$('[data-testid=auth-form]');f.dataset.mode=signup?'register':'login';$('[data-testid=auth-submit]').textContent=signup?'Sign up':'Log in';$('[data-testid=auth-toggle]').textContent=signup?'Back to login':'Create account'};
$('[data-testid=auth-form]').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));try{let r=await fetch('/api/auth/'+(signup?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});let j=await r.json();if(!r.ok)throw Error(j.error||'Invalid input');token=j.token;localStorage.setItem('huddle.token',token);boot()}catch(x){$('[data-testid=auth-error]').textContent=x.message||'Invalid input'}};
$('[data-testid=logout-btn]').onclick=()=>{localStorage.removeItem('huddle.token');location.reload()};$('[data-testid=send-btn]').onclick=async()=>{let i=$('[data-testid=message-input]');if(i.value.trim()&&current){await api('/channels/'+current+'/messages',{method:'POST',body:JSON.stringify({body:i.value})});i.value='';select(current)}};$('[data-testid=workspace-create-form]').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));try{let q=await api('/workspaces',{method:'POST',body:JSON.stringify(d)});workspace=q.workspace;await boot()}catch(x){e.target.dataset.error=x.message}};
$('[data-testid=new-channel-btn]').onclick=()=>document.querySelector('#create-channel-modal').classList.remove('hidden');
$('[data-testid=create-channel-cancel]').onclick=()=>document.querySelector('#create-channel-modal').classList.add('hidden');
$('[data-testid=create-channel-form]').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.is_private=document.querySelector('[data-testid=create-channel-private]').checked;try{let q=await api('/workspaces/'+workspace.slug+'/channels',{method:'POST',body:JSON.stringify(d)});document.querySelector('#create-channel-modal').classList.add('hidden');let w=await api('/workspaces/'+workspace.slug);let l=document.querySelector('[data-testid=channel-list]');l.innerHTML=w.channels.map(c=>`<div data-testid="channel-entry" data-channel-id="${c.id}" data-channel-name="${c.name}">#${c.name}</div>`).join('');l.querySelectorAll('[data-testid=channel-entry]').forEach(x=>x.onclick=()=>select(x.dataset.channelId));select(q.channel.id)}catch(x){document.querySelector('[data-testid=create-channel-error]').textContent=x.message||'Channel already exists'}};
function escui(x){return String(x).replace(/[&<>"]/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[a]))}
function renderRows(ms){let el=$('[data-testid=message-list]');el.innerHTML='';if(!ms.length){el.innerHTML='<div data-testid="empty-channel">No messages yet. Say hello!</div>';return}ms.reverse().forEach(m=>{let row=document.createElement('div');row.className='message';row.dataset.testid='message';row.dataset.messageId=m.id;let reactions=(m.reactions||[]).map(r=>'<button data-testid="reaction-chip" data-mid="'+m.id+'" data-emoji="'+escui(r.emoji)+'">'+escui(r.emoji)+' '+r.count+'</button>').join('');row.innerHTML='<span data-testid="message-avatar">'+escui((m.author.display_name||'?')[0])+'</span> <b data-testid="message-author">'+escui(m.author.display_name)+'</b> <span data-testid="message-time" title="'+m.created_at+'">'+new Date(m.created_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+'</span><div data-testid="message-body">'+escui(m.body)+(m.edited_at?'<span data-testid="message-edited"> (edited)</span>':'')+(m.reply_count?'<span data-testid="reply-count"> '+m.reply_count+' '+(m.reply_count==1?'reply':'replies')+'</span>':'')+'</div><div class="toolbar"><button data-testid="open-thread-btn" data-mid="'+m.id+'">Thread</button><button data-testid="reaction-button" data-mid="'+m.id+'">React</button>'+(m.author_id==user.id?'<button data-testid="message-edit-btn" data-mid="'+m.id+'">Edit</button><button data-testid="message-delete-btn" data-mid="'+m.id+'">Delete</button>':'')+'<div data-testid="emoji-picker" class="hidden" data-picker="'+m.id+'"><button data-testid="emoji-option" data-emoji="😀">😀</button><button data-testid="emoji-option" data-emoji="👍">👍</button><button data-testid="emoji-option" data-emoji="❤️">❤️</button><button data-testid="emoji-option" data-emoji="🎉">🎉</button><button data-testid="emoji-option" data-emoji="🔥">🔥</button><button data-testid="emoji-option" data-emoji="😂">😂</button><button data-testid="emoji-option" data-emoji="🚀">🚀</button><button data-testid="emoji-option" data-emoji="✅">✅</button></div></div>'+reactions;el.appendChild(row)}) ;wireRows()}
async function select(id){current=id;let d=await api('/channels/'+id);currentChannel=d.channel;$('[data-testid=channel-title]').textContent=currentChannel.name;$('[data-testid=channel-topic]').textContent=currentChannel.topic||'';let q=await api('/channels/'+id+'/messages');renderRows(q.messages)}
function wireRows(){document.querySelectorAll('[data-testid=reaction-button]').forEach(b=>b.onclick=()=>{$('[data-picker="'+b.dataset.mid+'"]').classList.remove('hidden')});document.querySelectorAll('[data-testid=emoji-option]').forEach(b=>b.onclick=async()=>{await api('/messages/'+b.closest('[data-testid=message]').dataset.messageId+'/reactions',{method:'POST',body:JSON.stringify({emoji:b.dataset.emoji})});select(current)});document.querySelectorAll('[data-testid=reaction-chip]').forEach(b=>b.onclick=async()=>{await api('/messages/'+b.dataset.mid+'/reactions/'+encodeURIComponent(b.dataset.emoji),{method:'DELETE'});select(current)});document.querySelectorAll('[data-testid=message-delete-btn]').forEach(b=>b.onclick=async()=>{await api('/messages/'+b.dataset.mid,{method:'DELETE'});select(current)});document.querySelectorAll('[data-testid=message-edit-btn]').forEach(b=>b.onclick=()=>{let row=b.closest('[data-testid=message]'),body=row.querySelector('[data-testid=message-body]'),old=body.textContent.replace(/\s*\(edited\).*$/,'').replace(/\s*\d+ repl(ies|y)$/,'');body.innerHTML='<input data-testid="message-edit-input" value="'+escui(old)+'"><button data-testid="message-edit-save">Save</button>';let i=body.querySelector('input');i.focus();let save=async()=>{await api('/messages/'+b.dataset.mid,{method:'PATCH',body:JSON.stringify({body:i.value})});select(current)};i.onkeydown=e=>{if(e.key==='Enter')save();if(e.key==='Escape')select(current)};body.querySelector('button').onclick=save});document.querySelectorAll('[data-testid=open-thread-btn]').forEach(b=>b.onclick=()=>openThread(b.dataset.mid))}
async function openThread(id){thread=id;$('#thread-panel').classList.remove('hidden');let q=await api('/messages/'+id+'/replies');$('#thread-content').innerHTML=q.replies.map(x=>'<div data-testid="thread-message">'+escui(x.body)+'</div>').join('')}
$('[data-testid=thread-send]').onclick=async()=>{let i=$('[data-testid=thread-input]');if(i.value.trim()){await api('/channels/'+current+'/messages',{method:'POST',body:JSON.stringify({body:i.value,parent_id:Number(thread)})});i.value='';openThread(thread);select(current)}}
$('[data-testid=close-thread]').onclick=()=>$('#thread-panel').classList.add('hidden')
let livews;function connectLive(){if(livews)livews.close();if(!token||!current)return;livews=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/api/ws?token='+encodeURIComponent(token));livews.onopen=()=>livews.send(JSON.stringify({type:'subscribe',channel_id:Number(current)}));livews.onmessage=e=>{try{let z=JSON.parse(e.data);if(z.channel_id==current&&z.type&&z.type.indexOf('message.')===0)select(current)}catch(x){}}}
const oldSelect=select;select=async id=>{await oldSelect(id);connectLive()}
boot();
</script></body></html>
