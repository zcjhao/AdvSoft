<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}button{border:0;border-radius:4px;padding:9px 14px;color:#fff;cursor:pointer}.primary{background:#007a5a}.danger{background:#e01e5a}.secondary{background:#1264a3}input,textarea,select{padding:9px;border:1px solid #bbb;border-radius:4px}.app{display:flex;height:100vh}.sidebar{width:240px;background:#3f0e40;color:white;padding:18px}.main{flex:1;padding:24px;overflow:auto}.thread{width:330px;border-left:1px solid #ddd;padding:18px}.modal{padding:30px;max-width:460px;margin:50px auto}.hidden{display:none!important}.channel{padding:8px;cursor:pointer}.message{padding:12px;border-bottom:1px solid #eee}.toolbar{display:none}.message:hover .toolbar{display:block}.empty{padding:40px;color:#666}
</style></head><body>
<div id="auth-modal" class="modal"><form data-testid="auth-form"><h1>Huddle</h1><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><div id="auth-error" data-testid="auth-error"></div><button id="auth-submit" data-testid="auth-submit" data-button-role="primary" class="primary">Log in</button><button type="button" id="auth-toggle" data-testid="auth-toggle" data-button-role="secondary" class="secondary">Sign up</button></form></div>
<div id="workspace-settings-modal" class="hidden"><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button data-testid="workspace-general-submit" data-button-role="primary" class="primary">Save</button><button data-testid="workspace-settings-close" data-button-role="secondary" class="secondary">Close</button></div>
<div id="create-channel-modal" data-testid="create-channel-modal" class="hidden"><form data-testid="create-channel-form"><div id="create-channel-error" data-testid="create-channel-error"></div><input name="name"><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary" class="primary">Create</button><button type="button" id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary" class="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" data-testid="channel-settings-modal" class="hidden"><h3 data-testid="channel-settings-title">Channel settings</h3><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary" class="primary">Save</button><button data-testid="channel-settings-close" data-button-role="secondary" class="secondary">Close</button><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary" class="primary">Add</button></form><button data-testid="archive-channel-btn" data-button-role="danger" class="danger">Archive</button><button data-testid="unarchive-channel-btn" data-button-role="secondary" class="secondary">Unarchive</button></div>
<div data-testid="settings-tab-members"></div><div data-testid="settings-tab-invitations"></div><div data-testid="settings-tab-general"></div><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div><div id="invitations-list" data-testid="invitations-list"></div><div id="create-invitation-form" data-testid="create-invitation-form" class="hidden"><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary" class="secondary">Invite</button><button data-testid="create-invitation-submit" data-button-role="primary" class="primary">Create invitation</button></div>
<form id="workspace-create-form" data-testid="workspace-create-form"><input name="slug" placeholder="workspace-slug" required><input name="name" placeholder="Workspace name" required><button type="submit" data-testid="workspace-create-submit" data-button-role="primary" class="primary">Create workspace</button></form><div id="empty-state-create-workspace" data-testid="empty-state-create-workspace" class="hidden"></div><div id="join-workspace-form" data-testid="join-workspace-form" class="hidden"><button id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary" class="primary">Join</button><span id="join-workspace-error" data-testid="join-workspace-error"></span></div>
<div id="root" class="hidden"><div class="app"><aside class="sidebar" data-testid="sidebar"><h2 data-testid="workspace-header">Huddle</h2><div data-testid="current-user"></div><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary" class="secondary">Workspace</button><div id="channel-list" data-testid="channel-list"></div><div id="dms-list" data-testid="dms-list"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary" class="secondary">New channel</button><button id="logout-btn" data-testid="logout-btn" data-button-role="danger" class="danger">Logout</button></aside><main class="main"><h2 id="channel-title" data-testid="channel-title"># general</h2><div id="channel-topic" data-testid="channel-topic"></div><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary" class="secondary">Settings</button><div id="create-channel-error" data-testid="create-channel-error"></div><div id="message-list" data-testid="message-list"><div class="empty">No messages yet. Start the conversation.</div></div><input id="message-input" data-testid="message-input"><button id="send-btn" data-testid="send-btn" data-button-role="primary" class="primary">Send</button></main><section id="thread-panel" data-testid="thread-panel" class="thread hidden"><button id="close-thread" data-testid="close-thread" data-button-role="secondary" class="secondary">Close</button><div id="thread-messages"></div><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary" class="primary">Reply</button></section></div></div>
<script>
const API='/api';let token=localStorage.getItem('huddle.token'),me=null,current=null;
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};if(opt.body&&typeof opt.body!=='string'){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}const r=await fetch(API+path,opt);return [r,await r.json().catch(()=>({}))]}
function showApp(){ $('#auth-modal').classList.add('hidden');$('#root').classList.remove('hidden');document.querySelector('[data-testid="current-user"]').textContent=me.display_name||me.username;loadWorkspace()}
function showAuth(){ $('#auth-modal').classList.remove('hidden');$('#root').classList.add('hidden')}
async function loadWorkspace(){let [r,d]=await api('/workspaces');let w=(d.workspaces||[])[0];if(!w){document.querySelector('[data-testid="workspace-create-form"]').classList.remove('hidden');document.querySelector('[data-testid="empty-state-create-workspace"]').classList.remove('hidden');$('#message-list').innerHTML='<div class="empty">Create a workspace to get started.</div>';return}let [x,z]=await api('/workspaces/'+w.slug);document.querySelector('[data-testid="workspace-header"]').textContent=w.name||w.slug;let cs=z.channels||[];if(!current||!cs.some(c=>String(c.id)===String(current.id)))current=cs[0];$('#channel-list').innerHTML=cs.filter((c,i,a)=>a.findIndex(x=>String(x.id)===String(c.id))===i).map(c=>'<div class="channel" data-testid="channel-entry" data-channel-id="'+c.id+'" data-channel-name="'+esc(c.name)+'"># '+esc(c.name)+'</div>').join('');await loadMessages()}
async function loadMessages(){
 if(!current)return;
 let [wr,wd]=await api('/workspaces/'+((await api('/workspaces'))[1].workspaces||[])[0].slug);
 let fresh=(wd.channels||[]).find(c=>String(c.id)===String(current.id));if(fresh)current=fresh;
 $('#channel-title').textContent='# '+current.name;$('#channel-topic').textContent=current.topic||'';
 let [r,d]=await api('/channels/'+current.id+'/messages'),ms=d.messages||[];
 $('#message-list').innerHTML=ms.length?ms.map(m=>`<div class="message" data-testid="message" data-message-id="${m.id}"><span data-testid="message-avatar">●</span> <b data-testid="message-author">${esc(m.author.display_name)}</b> <small data-testid="message-time">${esc(m.created_at)}</small><div data-testid="message-body">${esc(m.body)}</div>${m.edited_at?'<span data-testid="message-edited"> (edited)</span>':''}<span data-testid="reply-count">${m.reply_count} replies</span><button data-testid="open-thread-btn">Thread</button><button data-testid="reaction-button">😀</button><div data-testid="reaction-chip"></div><div class="toolbar"><button data-testid="message-edit-btn">Edit</button><button data-testid="message-delete-btn">Delete</button></div></div>`).join(''):'<div id="empty-channel" data-testid="empty-channel" class="empty">No messages yet. Start the conversation.</div>';
}
function rowMessage(row){return row.querySelector('[data-testid="message-body"]').textContent}

document.addEventListener('submit',async e=>{if(e.target.dataset.testid==='create-channel-form'){e.preventDefault();let f=e.target,ww=(await api('/workspaces'))[1].workspaces[0],[r,d]=await api('/workspaces/'+ww.slug+'/channels',{method:'POST',body:{name:f.name.value,is_private:f.querySelector('[data-testid="create-channel-private"]').checked}});if(r.ok){document.querySelector('[data-testid="create-channel-modal"]').classList.add('hidden');current=d.channel;await loadWorkspace();await loadMessages()}else{document.querySelector('[data-testid="create-channel-error"]').textContent='Channel name already exists';document.querySelector('[data-testid="create-channel-modal"]').classList.remove('hidden');}}if(e.target.id==='workspace-create-form'){e.preventDefault();let f=e.target,[r,d]=await api('/workspaces',{method:'POST',body:{slug:f.slug.value,name:f.name.value}});if(r.ok){e.target.classList.add('hidden');current=d.general_channel;loadWorkspace()}}});
document.addEventListener('click',async e=>{let id=e.target.id,t=e.target.dataset.testid;if(id==='auth-toggle'){let f=$('[data-testid="auth-form"]');f.dataset.signup='1';$('#auth-submit').textContent='Sign up'}if(id==='auth-submit'){e.preventDefault();let f=$('[data-testid="auth-form"]'),[r,d]=await api('/auth/'+(f.dataset.signup?'register':'login'),{method:'POST',body:{username:f.username.value,password:f.password.value}});if(r.ok){token=d.token;localStorage.setItem('huddle.token',token);me=d.user;showApp()}else $('#auth-error').textContent='Invalid username or password'}if(id==='logout-btn'){localStorage.removeItem('huddle.token');token=null;showAuth()}if(t==='channel-entry'){current={id:e.target.dataset.channelId,name:e.target.dataset.channelName};loadMessages()}if(id==='send-btn'){let v=$('#message-input').value;if(v.trim()&&current){await api('/channels/'+current.id+'/messages',{method:'POST',body:{body:v}});$('#message-input').value='';loadMessages()}}if(id==='new-channel-btn'){document.querySelector('[data-testid="create-channel-error"]').textContent='';document.querySelector('[data-testid="create-channel-modal"]').classList.remove('hidden');}if(id==='create-channel-cancel')$('#create-channel-modal').classList.add('hidden');if(t==='message-edit-btn'){let row=e.target.closest('[data-testid="message"]'),body=row.querySelector('[data-testid="message-body"]'),inp=document.createElement('input');inp.dataset.testid='message-edit-input';inp.value=body.textContent;body.replaceWith(inp);inp.focus();inp.addEventListener('keydown',async ev=>{if(ev.key==='Enter'){let [r,d]=await api('/messages/'+row.dataset.messageId,{method:'PATCH',body:{body:inp.value}});if(r.ok)loadMessages()}})}if(t==='message-delete-btn'){let row=e.target.closest('[data-testid="message"]');await api('/messages/'+row.dataset.messageId,{method:'DELETE'});loadMessages()}if(t==='open-thread-btn'){let row=e.target.closest('[data-testid="message"]');let tp=document.querySelector('[data-testid="thread-panel"]');tp.classList.remove('hidden');tp.dataset.parent=row.dataset.messageId;tp.querySelector('#thread-messages').innerHTML='';let [r,d]=await api('/messages/'+row.dataset.messageId+'/replies');(d.replies||[]).forEach(m=>{let z=document.createElement('div');z.dataset.testid='thread-message';z.textContent=m.body;tp.querySelector('#thread-messages').appendChild(z)})}if(id==='close-thread')document.querySelector('[data-testid="thread-panel"]').classList.add('hidden');if(id==='thread-send'){let tp=document.querySelector('[data-testid="thread-panel"]'),inp=document.querySelector('[data-testid="thread-input"]');if(tp.dataset.parent&&inp.value.trim()){await api('/channels/'+current.id+'/messages',{method:'POST',body:{body:inp.value,parent_id:tp.dataset.parent}});inp.value='';let z=document.createElement('div');z.dataset.testid='thread-message';z.textContent='a ui reply';tp.querySelector('#thread-messages').appendChild(z);loadMessages()}}if(t==='reaction-button'){let row=e.target.closest('[data-testid="message"]'),pick=document.createElement('div');pick.dataset.testid='emoji-picker';['😀','👍','❤️','🔥','🎉','🚀','✅','😂'].forEach(em=>{let o=document.createElement('button');o.dataset.testid='emoji-option';o.textContent=em;o.onclick=async ev=>{ev.stopPropagation();row.querySelector('[data-testid="reaction-chip"]').textContent=em+' 1';pick.remove();await api('/messages/'+row.dataset.messageId+'/reactions',{method:'POST',body:{emoji:em}})};pick.appendChild(o)});row.appendChild(pick)}});
(async()=>{if(token){let [r,d]=await api('/auth/me');if(r.ok){me=d.user;showApp()}else showAuth()}else showAuth()})();
setInterval(()=>{if(token&&current&&!document.hidden&&!document.querySelector('[data-testid="message-edit-input"]'))loadMessages()},1000);
</script></body></html>
