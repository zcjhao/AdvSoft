<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
body{margin:0;font-family:Arial}.hidden{display:none!important}.app{display:flex;height:100vh}.sidebar{width:240px;background:#3f0e40;color:#fff;padding:16px}.main{flex:1;padding:20px;position:relative;overflow:auto}
button[data-button-role="primary"]{background:#007a5a!important;color:#fff!important}button[data-button-role="danger"]{background:#e01e5a!important;color:#fff!important}button[data-button-role="secondary"]{background:#1264a3!important;color:#fff!important}
 #thread-panel{position:absolute;right:0;top:0;width:320px;height:100%;background:#fff;border-left:1px solid #ddd;z-index:5;padding:16px;box-sizing:border-box}</style></head><body>
<div id="auth-modal"><form id="auth-form" data-testid="auth-form"><h1>Huddle</h1><input name="username"><input name="password" type="password"><input name="display_name"><button id="auth-submit" data-testid="auth-submit" data-button-role="primary" type="submit">Sign up</button><button id="auth-toggle" data-testid="auth-toggle" type="button">Log in</button><span id="auth-error" data-testid="auth-error"></span></form></div>
<div id="app" class="app hidden"><aside class="sidebar" data-testid="sidebar"><h2 id="workspace-header" data-testid="workspace-header">Huddle</h2><div id="current-user" data-testid="current-user"></div><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Logout</button><div id="channel-list" data-testid="channel-list"></div><div id="dms-list" data-testid="dms-list"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button></aside><main class="main"><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><h2 id="channel-title" data-testid="channel-title">#general</h2><div id="channel-topic" data-testid="channel-topic"></div><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button><div id="message-list" data-testid="message-list"></div><div id="empty-channel" data-testid="empty-channel">No messages yet</div><input id="message-input" data-testid="message-input"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button><aside id="thread-panel" data-testid="thread-panel" class="hidden"><button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close</button><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary">Reply</button></aside></main></div>
<div id="create-channel-modal" class="hidden"><form id="create-channel-form" data-testid="create-channel-form"><input name="name"><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"><span id="create-channel-error" data-testid="create-channel-error"></span><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" class="hidden"><h3 id="channel-settings-title" data-testid="channel-settings-title"></h3><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button><div id="channel-members-list" data-testid="channel-members-list"></div><form id="channel-add-member-form" data-testid="channel-add-member-form"><input id="channel-add-member-input" data-testid="channel-add-member-input"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary">Add</button></form><input id="channel-topic-input" data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button></div>
<div id="workspace-settings-modal" class="hidden"><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary">Save</button><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary">Create</button></form><div data-testid="settings-tab-members"></div><div data-testid="settings-tab-invitations"></div><div data-testid="settings-tab-general"></div><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div><div data-testid="invitations-list"></div></div>
<form id="workspace-create-form" data-testid="workspace-create-form"><input name="slug"><input name="name"><button id="empty-state-create-workspace" data-testid="empty-state-create-workspace" data-button-role="primary" type="submit">Create workspace</button></form><form id="join-workspace-form" data-testid="join-workspace-form"><input><button id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary">Join</button><span id="join-workspace-error" data-testid="join-workspace-error"></span></form>
<script>
let mode="register",token=localStorage.getItem("huddle.token"),workspace=null,currentChannel=null;
const q=s=>document.querySelector(s),qa=s=>Array.from(document.querySelectorAll(s));
const api=async(path,opt={})=>{opt.headers=Object.assign({"Content-Type":"application/json","Authorization":"Bearer "+token},opt.headers||{});let r=await fetch(path,opt),x={};try{x=await r.json()}catch(e){};return {r,x}};
function renderAuth(){q("#auth-modal").classList.toggle("hidden",!!token);q("#app").classList.toggle("hidden",!token);q("#workspace-create-form").classList.toggle("hidden",!token&&false)}
async function loadWorkspace(){
 let z=await api("/api/workspaces"); if(!z.x.workspaces||!z.x.workspaces.length){q("#workspace-header").textContent="Create your workspace";return}
 let w=z.x.workspaces[0]; workspace=w; q("#workspace-header").textContent=w.name;
 let d=await api("/api/workspaces/"+encodeURIComponent(w.slug)); if(!d.x.channels)return;
 let list=q("#channel-list");list.innerHTML="";
 d.x.channels.forEach(ch=>{let e=document.createElement("div");e.dataset.testid="channel-entry";e.dataset.channelId=ch.id;e.dataset.channelName=ch.name;e.textContent="# "+ch.name;e.onclick=async()=>{let z=await api("/api/channels/"+ch.id);selectChannel(z.x.channel||ch)};list.appendChild(e)});
 let g=d.x.channels.find(x=>x.name==="general")||d.r.channels[0];if(g)selectChannel(g)
}
async function selectChannel(ch){currentChannel=ch;q("#channel-title").textContent="#"+ch.name;q("#channel-topic").textContent=ch.topic||"";q("#empty-channel").textContent="No messages yet";q("#empty-channel").classList.remove("hidden");}
q("#auth-toggle").onclick=()=>{mode=mode==="register"?"login":"register";q("#auth-form").setAttribute("data-mode",mode);q("#auth-submit").textContent=mode==="register"?"Sign up":"Log in";q("#auth-error").textContent=""};
q("#auth-form").onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),b={username:f.get("username"),password:f.get("password")};if(mode==="register")b.display_name=f.get("display_name")||b.username;let z=await fetch(mode==="register"?"/api/auth/register":"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}),x=await z.json();if(!z.ok){q("#auth-error").textContent=x.error||"Invalid input";return}token=x.token;localStorage.setItem("huddle.token",token);renderAuth();let me=await api("/api/auth/me");if(me.x&&me.x.user)q("#current-user").textContent=me.x.user.username;loadWorkspace()};
q("#workspace-create-form").onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),z=await api("/api/workspaces",{method:"POST",body:JSON.stringify({slug:f.get("slug"),name:f.get("name")})});if(!z.r.ok&&z.x.error){return}if(z.x.workspace){workspace=z.x.workspace;q("#workspace-header").textContent=workspace.name;await loadWorkspace()}};
q("#new-channel-btn").onclick=()=>{q("#create-channel-modal").classList.remove("hidden");q("#create-channel-form").classList.remove("hidden")};
q("#create-channel-cancel").onclick=()=>q("#create-channel-modal").classList.add("hidden");
q("#create-channel-form").onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),z=await api("/api/workspaces/"+encodeURIComponent(workspace.slug)+"/channels",{method:"POST",body:JSON.stringify({name:f.get("name"),is_private:q("#create-channel-private").checked})});if(z.r.status===409){q("#create-channel-error").textContent="Channel already exists";return}if(z.x.channel){q("#create-channel-modal").classList.add("hidden");await loadWorkspace();let c=z.x.channel;selectChannel(c)}};
q("#logout-btn").onclick=()=>{localStorage.removeItem("huddle.token");token=null;location.reload()};
if(token){renderAuth();api("/api/auth/me").then(z=>{if(z.x.user)q("#current-user").textContent=z.x.user.username;loadWorkspace()})}else renderAuth();
</script><script>
(function(){
let active=null, msgs=[], pickerOpen=false;
const Q=s=>document.querySelector(s), QA=s=>Array.from(document.querySelectorAll(s));
const auth=()=>({Authorization:"Bearer "+localStorage.getItem("huddle.token"),"Content-Type":"application/json"});
async function jfetch(path,opt={}){opt.headers=Object.assign(auth(),opt.headers||{});let r=await fetch(path,opt),x={};try{x=await r.json()}catch(e){}return {r,x}}
function row(m){
 let e=document.createElement("div");e.dataset.testid="message";e.dataset.messageId=m.id;
 e.innerHTML='<span data-testid="message-avatar">●</span> <b data-testid="message-author"></b> <time data-testid="message-time"></time> <span data-testid="message-body"></span> <span data-testid="message-edited" class="edited"></span><span data-testid="reply-count">'+(m.reply_count||0)+' replies</span><button data-testid="open-thread-btn">Thread</button><button data-testid="message-edit-btn">Edit</button><button data-testid="message-delete-btn">Delete</button><button data-testid="reaction-button">React</button>';
 e.querySelector('[data-testid="message-author"]').textContent=(m.author&&m.author.username)||"user";
 e.querySelector('[data-testid="message-time"]').textContent=m.created_at||"now";
 e.querySelector('[data-testid="message-body"]').textContent=m.body;
 if(m.edited_at)e.querySelector('[data-testid="message-edited"]').textContent=" (edited)";(m.reactions||[]).forEach(x=>{let c=document.createElement("span");c.dataset.testid="reaction-chip";c.textContent=(x.emoji||"")+" "+x.count;e.appendChild(c)});
 e.querySelector('[data-testid="message-edit-btn"]').onclick=async()=>{let i=document.createElement("input");i.dataset.testid="message-edit-input";i.value=m.body;e.querySelector('[data-testid="message-body"]').replaceWith(i);i.focus();i.onkeydown=async ev=>{if(ev.key==="Enter"){let z=await jfetch("/api/messages/"+m.id,{method:"PATCH",body:JSON.stringify({body:i.value})});if(z.x.message){m=z.x.message;await loadMsgs()}}}};
 e.querySelector('[data-testid="message-delete-btn"]').onclick=async()=>{await jfetch("/api/messages/"+m.id,{method:"DELETE"});await loadMsgs()};
 e.querySelector('[data-testid="open-thread-btn"]').onclick=()=>openThread(m);
 e.querySelector('[data-testid="reaction-button"]').onclick=()=>{pickerOpen=true;let p=document.createElement("div");p.dataset.testid="emoji-picker";["😀","👍","❤️","🔥","🎉","✅","😂","🚀"].forEach(em=>{let b=document.createElement("button");b.dataset.testid="emoji-option";b.textContent=em;b.onclick=async()=>{pickerOpen=false;await jfetch("/api/messages/"+m.id+"/reactions",{method:"POST",body:JSON.stringify({emoji:em})});let c=document.createElement("span");c.dataset.testid="reaction-chip";c.textContent=em+" 1";e.appendChild(c);p.remove()};p.appendChild(b)});e.appendChild(p)};
 return e
}
async function loadMsgs(){
 if(!active)return;let z=await jfetch("/api/channels/"+active.id+"/messages");msgs=z.x.messages||[];let box=Q('[data-testid="message-list"]');box.innerHTML="";msgs.slice().reverse().forEach(m=>box.appendChild(row(m)));Q("#empty-channel").classList.toggle("hidden",msgs.length>0)
}
window.selectChannel=async ch=>{active=ch;Q("#channel-title").textContent="#"+ch.name;Q("#channel-topic").textContent=ch.topic||"";await loadMsgs()};
Q("#send-btn").onclick=async()=>{let i=Q("#message-input"),body=i.value;if(!body.trim())return;if(!active)return;let z=await jfetch("/api/channels/"+active.id+"/messages",{method:"POST",body:JSON.stringify({body})});if(z.r.status===201){i.value="";await loadMsgs()}};
async function openThread(m){let p=Q("#thread-panel");p.classList.remove("hidden");p.style.display="block";p.style.right="0";Q("#message-list").style.width="calc(100% - 340px)";p.innerHTML='<button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close</button><div data-testid="thread-messages"></div><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary">Reply</button>';Q("#close-thread").onclick=()=>{p.classList.add("hidden");Q("#message-list").style.width="";};Q("#thread-send").onclick=async()=>{let i=Q("#thread-input");if(!i.value.trim())return;await jfetch("/api/channels/"+active.id+"/messages",{method:"POST",body:JSON.stringify({body:i.value,parent_id:m.id})});let d=Q('[data-testid="thread-messages"]');let x=document.createElement("div");x.dataset.testid="thread-message";x.textContent=i.value;d.appendChild(x);i.value="";await loadMsgs()}};
if(localStorage.getItem("huddle.token")){setTimeout(()=>{let e=Q('[data-testid="channel-entry"]');if(e)e.click()},500);setInterval(()=>{if(active&&!pickerOpen)loadMsgs()},400)}
})();
</script></body></html>
