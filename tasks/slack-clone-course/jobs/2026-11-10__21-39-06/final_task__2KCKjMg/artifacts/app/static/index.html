<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#222;background:#fff}.hidden,[hidden],#auth-modal[hidden],#app[hidden],#message-list[hidden],#thread-panel[hidden],#create-channel-modal[hidden],#channel-settings-modal[hidden],#workspace-settings-modal[hidden]{display:none!important}
button{border:0;border-radius:4px;padding:9px 14px;cursor:pointer;font-weight:600}[data-button-role=primary]{background-color:#007a5a;color:#fff}[data-button-role=danger]{background-color:#e01e5a;color:#fff}[data-button-role=secondary]{background-color:#1264a3;color:#fff}
input,select,textarea{padding:9px;border:1px solid #bbb;border-radius:4px}#auth-modal{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f5f5}.authbox{background:white;padding:30px;width:360px;border-radius:8px;box-shadow:0 2px 12px #bbb}.authbox form{display:grid;gap:12px}
#app{display:flex;height:100vh}.sidebar{width:270px;background:#3f0e40;color:#fff;padding:18px;overflow:auto}.sidebar h2{margin-top:0}.sidebar button{margin:5px 0}.main{flex:1;display:flex;flex-direction:column}.header{height:70px;border-bottom:1px solid #ddd;padding:14px 22px}.content{padding:20px;overflow:auto;flex:1}.thread{width:330px;border-left:1px solid #ddd;padding:16px}.message-row{padding:12px;border-bottom:1px solid #eee;position:relative}.msg-toolbar{display:flex;gap:5px;margin-top:6px}.msg-toolbar button{padding:4px 7px;font-size:12px}.message-avatar{display:inline-flex;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;background:#1264a3;color:#fff;margin-right:8px}.message-author{font-weight:bold;margin-right:8px}.message-time{font-size:12px;color:#777}.message-body{margin:7px 0 3px}.reaction-chip{margin:4px 4px 0 0;padding:3px 7px;background:#eef4ff;border:1px solid #b7c9e8;border-radius:12px}.emoji-picker{display:grid;grid-template-columns:repeat(4,36px);gap:5px;padding:8px;background:#fff;border:1px solid #aaa;position:absolute;z-index:5}.reply-count{font-size:12px;color:#1264a3}.empty{color:#666;padding:40px;text-align:center}.err{color:#c00;min-height:20px}
</style></head><body>
<div id="auth-modal"><div class="authbox"><h1>Huddle</h1><form id="auth-form" data-testid="auth-form"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><input name="display_name" placeholder="Display name"><div id="auth-error" data-testid="auth-error" class="err"></div><button type="submit" id="auth-submit" data-testid="auth-submit" data-button-role="primary">Log in</button></form><button id="auth-toggle" data-testid="auth-toggle">Create account</button></div></div>
<div id="app" hidden><aside id="sidebar" class="sidebar" data-testid="sidebar"><h2 id="workspace-header" data-testid="workspace-header">Huddle</h2><div id="current-user" data-testid="current-user"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Logout</button><h3>Channels</h3><div id="channel-list" data-testid="channel-list"></div><div id="dms-list" data-testid="dms-list"></div><button id="empty-state-create-workspace" data-testid="empty-state-create-workspace">Create workspace</button><form id="workspace-create-form" data-testid="workspace-create-form"><input name="slug" placeholder="workspace slug"><input name="name" placeholder="workspace name"><button type="submit" data-button-role="primary" data-testid="workspace-general-submit">Create</button></form><form id="join-workspace-form" data-testid="join-workspace-form"><input name="code" placeholder="Join workspace"><button data-button-role="primary" data-testid="join-workspace-submit">Join</button><div data-testid="join-workspace-error"></div></form></aside>
<main class="main"><header class="header"><b id="channel-title" data-testid="channel-title"># general</b><span id="channel-topic" data-testid="channel-topic"></span><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Settings</button></header><section class="content"><div id="message-list" data-testid="message-list" hidden><div class="empty">No messages yet. Start the conversation!</div></div><form id="message-form"><input id="message-input" data-testid="message-input" name="body" placeholder="Write a message"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></form></section></main>
<aside id="thread-panel" class="thread" data-testid="thread-panel" hidden><h3>Thread</h3><div id="thread-messages"></div><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary">Send</button><button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close</button></aside></div>
<div id="create-channel-modal" hidden><form id="create-channel-form" data-testid="create-channel-form"><input name="name"><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"><div id="create-channel-error" data-testid="create-channel-error"></div><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" hidden><h3 id="channel-settings-title" data-testid="channel-settings-title">Channel settings</h3><div id="channel-members-list" data-testid="channel-members-list"></div><form id="channel-add-member-form" data-testid="channel-add-member-form"><input id="channel-add-member-input" data-testid="channel-add-member-input"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary">Add</button></form><input id="channel-topic-input" data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button></div>
<div id="workspace-settings-modal" hidden><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button><div id="settings-tab-members" data-testid="settings-tab-members">Members</div><div id="settings-tab-invitations" data-testid="settings-tab-invitations">Invitations</div><div id="settings-tab-general" data-testid="settings-tab-general">General</div><div id="settings-pane-members" data-testid="settings-pane-members"></div><div id="settings-pane-invitations" data-testid="settings-pane-invitations"></div><div id="settings-pane-general" data-testid="settings-pane-general"></div><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button></form><div id="invitations-list" data-testid="invitations-list"></div></div>
<script>
let token=localStorage.getItem('huddle.token')||new URLSearchParams(location.search).get('token')||'',me=null,current=null,workspace=null,loaded=[],socket=null,threadParent=null;
const $=id=>document.querySelector('[data-testid="'+id+'"]');
const api=async(method,path,body)=>{let h={'Authorization':'Bearer '+token};if(body!==undefined)h['Content-Type']='application/json';let r=await fetch('/api'+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});return {status:r.status,data:await r.json().catch(()=>({}))}};
function showAuth(){document.getElementById('auth-modal').hidden=false;document.getElementById('app').hidden=true}
function showApp(){document.getElementById('auth-modal').hidden=true;document.getElementById('app').hidden=false}
function renderChannels(){let box=$('channel-list');box.innerHTML='';(workspace.channels||[]).forEach(ch=>{let e=document.createElement('div');e.dataset.testid='channel-entry';e.dataset.channelId=ch.id;e.dataset.channelName=ch.name;e.textContent='# '+ch.name;e.style.padding='8px';e.onclick=()=>selectChannel(ch.id);box.appendChild(e)})}
function formatTime(x){try{return new Date(x).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}catch(e){return ''}}
function renderMessage(m){let row=document.createElement('div');row.dataset.testid='message';row.dataset.messageId=m.id;row.className='message-row';let name=((m.author&&(m.author.display_name||m.author.username))||('User '+m.author_id))+'';let edited=m.edited_at?'<span data-testid="message-edited"> (edited)</span>':'';let replies=m.reply_count?'<div data-testid="reply-count" class="reply-count">'+m.reply_count+' repl'+(m.reply_count===1?'y':'ies')+'</div>':'';row.innerHTML='<span data-testid="message-avatar" class="message-avatar">'+name.charAt(0).toUpperCase()+'</span><span data-testid="message-author" class="message-author">'+name+'</span><span data-testid="message-time" class="message-time" title="'+(m.created_at||'')+'">'+(formatTime(m.created_at)||'now')+'</span><div data-testid="message-body" class="message-body"></div>'+edited+replies+'<div class="msg-toolbar"></div>';row.querySelector('[data-testid="message-body"]').textContent=m.body;let chips=document.createElement('div');(m.reactions||[]).forEach(x=>{let ch=document.createElement('button');ch.dataset.testid='reaction-chip';ch.dataset.emoji=x.emoji;ch.className='reaction-chip';ch.textContent=x.emoji+' '+x.count;ch.onclick=async()=>{if((x.user_ids||[]).map(String).includes(String(me.id)))await api('DELETE','/messages/'+m.id+'/reactions/'+encodeURIComponent(x.emoji));await loadMessages()};chips.append(ch)});row.append(chips);let bar=row.querySelector('.msg-toolbar');let thread=document.createElement('button');thread.dataset.testid='open-thread-btn';thread.textContent='Thread';thread.onclick=()=>openThread(m.id);let react=document.createElement('button');react.dataset.testid='reaction-button';react.textContent='React';react.onclick=()=>openPicker(row,m);bar.append(thread,react);if(String(m.author_id)===String(me.id)){let edit=document.createElement('button');edit.dataset.testid='message-edit-btn';edit.textContent='Edit';edit.onclick=()=>startEdit(row,m);let del=document.createElement('button');del.dataset.testid='message-delete-btn';del.textContent='Delete';del.onclick=async()=>{await api('DELETE','/messages/'+m.id);await loadMessages()};bar.append(edit,del)}return row}
async function loadMessages(){if(!current)return;let r=await api('GET','/channels/'+current.id+'/messages');loaded=r.data.messages||[];let box=$('message-list');box.hidden=false;box.innerHTML='';if(!loaded.length){let e=document.createElement('div');e.dataset.testid='empty-channel';e.textContent='No messages yet. Say hello!';box.append(e)}else loaded.slice().reverse().forEach(m=>box.append(renderMessage(m)))}
function startEdit(row,m){let old=row.querySelector('[data-testid="message-body"]');let inp=document.createElement('input');inp.dataset.testid='message-edit-input';inp.value=m.body;old.replaceWith(inp);inp.focus();let save=async()=>{let r=await api('PATCH','/messages/'+m.id,{body:inp.value});if(r.status===200)await loadMessages()};inp.onkeydown=e=>{if(e.key==='Enter')save();if(e.key==='Escape')loadMessages()}}
function openPicker(row,m){let old=document.querySelector('[data-testid="emoji-picker"]');if(old)old.remove();let p=document.createElement('div');p.dataset.testid='emoji-picker';p.className='emoji-picker';['😀','👍','❤️','🎉','🔥','😂','🚀','✅','👏','😄'].forEach(em=>{let b=document.createElement('button');b.dataset.testid='emoji-option';b.dataset.emoji=em;b.textContent=em;b.onclick=async()=>{await api('POST','/messages/'+m.id+'/reactions',{emoji:em});p.remove();await loadMessages()};p.append(b)});row.append(p)}
async function openThread(id){threadParent=id;let r=await api('GET','/messages/'+id+'/replies');let p=$('thread-panel');p.hidden=false;let box=document.getElementById('thread-messages');box.innerHTML='';(r.data.replies||[]).forEach(x=>{let e=document.createElement('div');e.dataset.testid='thread-message';e.textContent=x.body;box.append(e)});p.dataset.parentId=id}
async function selectChannel(id){let x=(workspace.channels||[]).find(c=>String(c.id)==String(id));if(!x)return;let fresh=await api('GET','/channels/'+id);if(fresh.status===200){x=fresh.data.channel;workspace.channels=workspace.channels.map(c=>String(c.id)==String(id)?x:c)}current=x;$('channel-title').textContent='# '+x.name;$('channel-topic').textContent=x.topic||'';await loadMessages();connectSocket()}
function connectSocket(){if(socket)try{socket.close()}catch(e){};socket=new WebSocket('ws://'+location.host+'/api/ws?token='+encodeURIComponent(token));socket.onopen=()=>socket.send(JSON.stringify({type:'subscribe',channel_id:current.id}));socket.onmessage=async e=>{try{let x=JSON.parse(e.data);let a=x.message&&x.message.author_id;if(x.channel_id==current.id&&x.type&&x.type.startsWith('message.')&&String(a)!==String(me&&me.id))await loadMessages()}catch(z){}}}
async function renderWorkspace(){if(me)$('current-user').textContent=me.username;let q=await api('GET','/workspaces');if(!q.data.workspaces||!q.data.workspaces.length){$('workspace-create-form').hidden=false;return}let w=q.data.workspaces[0],d=await api('GET','/workspaces/'+w.slug);workspace=d.data;$('workspace-header').textContent=w.name;$('current-user').textContent=me.username;renderChannels();showApp();if(workspace.channels.length)await selectChannel(workspace.channels[0].id)}
async function boot(){if(!token){showAuth();return}localStorage.setItem('huddle.token',token);let r=await api('GET','/auth/me');if(r.status!==200){localStorage.removeItem('huddle.token');token='';showAuth();return}me=r.data.user;showApp();await renderWorkspace()}
$('auth-form').dataset.mode='login';
$('auth-toggle').onclick=()=>{let f=$('auth-form'),reg=f.dataset.mode==='register';f.dataset.mode=reg?'login':'register';$('auth-submit').textContent=reg?'Log in':'Sign up'}
$('auth-form').onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(e.target)),path=e.target.dataset.mode==='register'?'/auth/register':'/auth/login',r=await fetch('/api'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),x=await r.json().catch(()=>({}));if(!r.ok){$('auth-error').textContent=x.error||'Unable to sign in';return}token=x.token;localStorage.setItem('huddle.token',token);me=x.user;showApp();await renderWorkspace()}
$('workspace-create-form').onsubmit=async e=>{e.preventDefault();let r=await api('POST','/workspaces',Object.fromEntries(new FormData(e.target)));if(r.status===201){e.target.hidden=true;await renderWorkspace()}}
$('new-channel-btn').onclick=()=>{document.getElementById('create-channel-modal').hidden=false;$('create-channel-form').hidden=false}
$('create-channel-cancel').onclick=()=>document.getElementById('create-channel-modal').hidden=true
$('create-channel-form').onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(e.target));b.is_private=$('create-channel-private').checked;let r=await api('POST','/workspaces/'+workspace.workspace.slug+'/channels',b);if(r.status!==201){$('create-channel-error').textContent=r.data.error||'Unable to create channel';return}document.getElementById('create-channel-modal').hidden=true;workspace.channels.push(r.data.channel);renderChannels();await selectChannel(r.data.channel.id)}
document.getElementById('message-form').onsubmit=async e=>{e.preventDefault();let inp=$('message-input');if(!inp.value.trim())return;let r=await api('POST','/channels/'+current.id+'/messages',{body:inp.value});if(r.status===201){inp.value='';await loadMessages()}}
document.getElementById('message-input').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('message-form').requestSubmit()}}
$('thread-send').onclick=async()=>{let inp=$('thread-input');if(!inp.value.trim())return;let r=await api('POST','/channels/'+current.id+'/messages',{body:inp.value,parent_id:threadParent});if(r.status===201){inp.value='';await openThread(threadParent);await loadMessages()}}
$('close-thread').onclick=()=>{$('thread-panel').hidden=true}
$('logout-btn').onclick=()=>{localStorage.removeItem('huddle.token');token='';if(socket)socket.close();showAuth()}
boot();
</script></body></html>
