<!doctype html><html><head><meta charset=utf-8><title>Huddle</title><style>
body{margin:0;font:14px Arial;color:#222}button{border:0;padding:9px 14px;color:#fff;border-radius:3px}.primary{background:#007a5a}.danger{background:#e01e5a}.secondary{background:#1264a3}#app{display:flex;height:100vh}.sidebar{width:250px;background:#3f0e40;color:white;padding:20px;box-sizing:border-box}.main{flex:1;padding:24px;position:relative}.row{position:relative}.toolbar{display:none}.row:hover .toolbar{display:block}[data-testid="message-list"]{width:calc(100% - 350px)}.thread-ui{position:fixed;right:0;top:0;width:330px;height:100vh;background:#fff;border-left:1px solid #ddd;padding:20px;box-sizing:border-box;z-index:3}.row{padding:10px;border-bottom:1px solid #ddd}.muted{color:#777}input,textarea{padding:9px;margin:4px}.modal{padding:25px}
</style><style>[data-button-role="primary"]{background-color:#007a5a;color:#ffffff}[data-button-role="danger"]{background-color:#e01e5a;color:#ffffff}[data-button-role="secondary"]{background-color:#1264a3;color:#ffffff}</style></head><body><div id=app><aside class=sidebar data-testid=sidebar><h2 data-testid=workspace-header>Huddle</h2><div data-testid=current-user></div><button data-testid=logout-btn data-button-role=danger class=danger>Logout</button><h3>Channels</h3><div id=channels data-testid=channel-list></div><button data-testid=new-channel-btn data-button-role=secondary class=secondary>New channel</button></aside><main class=main><section id=auth-modal class=modal><form data-testid=auth-form><h1>Welcome</h1><input name=username placeholder=username><input name=password type=password placeholder=password><input name=display_name placeholder=display name><button type=submit data-testid=auth-submit data-button-role=primary class=primary>Sign in</button><button type=button data-testid=auth-toggle>Sign up</button><div id=auth-error data-testid=auth-error></div></form></section><section id=workspace-settings-modal hidden></section><section id=create-channel-modal hidden><form data-testid=create-channel-form><input name=name placeholder=channel><button data-testid=create-channel-submit data-button-role=primary class=primary>Create</button><button type=button data-testid=create-channel-cancel data-button-role=secondary class=secondary>Cancel</button><div id=channel-error data-testid=create-channel-error></div></form></section><section id=channel-settings-modal hidden></section><section id=chat hidden><form id=workspace-create-form data-testid=workspace-create-form hidden><input name=slug placeholder=slug><input name=name placeholder=name><button type=submit data-testid=workspace-general-submit data-button-role=primary class=primary>Create workspace</button></form><h1 data-testid=channel-title></h1><div data-testid=channel-topic></div><div id=messages data-testid=message-list></div><div class=empty-channel id=empty-channel data-testid=empty-channel>No messages yet — start the conversation.</div><form id=sendform><input id=message-input data-testid=message-input><button id=send-btn data-testid=send-btn data-button-role=primary class=primary>Send</button></form><aside id=thread-panel data-testid=thread-panel hidden></aside></section></main></div><script>
let token=localStorage.getItem('huddle.token'),me,ws,channel,workspaceSlug;const $=x=>document.querySelector(x);
function api(p,o={}){o.headers={...(o.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};if(o.body&&typeof o.body!='string'){o.headers['Content-Type']='application/json';o.body=JSON.stringify(o.body)}return fetch('/api'+p,o).then(async r=>{let text=await r.text(),data={};try{data=JSON.parse(text)}catch(e){data={error:text||'request failed'}}return [r,data]})}
function showAuth(){ $('#auth-modal').hidden=false;$('#chat').hidden=true }
async function load(preferred){let [r,x]=await api('/auth/me');if(!r.ok)return showAuth();me=x.user;let cu=$('.sidebar [data-testid=current-user]');if(cu)cu.textContent=me.display_name;$('#auth-modal').hidden=true;let [,w]=await api('/workspaces');if(!w.workspaces.length){$('#chat').hidden=false;$('#workspace-create-form').hidden=false;$('#workspace-create-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),[r]=await api('/workspaces',{method:'POST',body:{slug:f.get('slug'),name:f.get('name')}});if(r.ok)load()};return}workspaceSlug=w.workspaces[0].slug;let wh=$('[data-testid=workspace-header]');if(wh)wh.textContent=w.workspaces[0].name;let [,d]=await api('/workspaces/'+workspaceSlug);renderChannels(d.channels);select(d.channels.find(c=>String(c.id)===String(preferred))||d.channels[0])}
function renderChannels(cs){$('#channels').replaceChildren(...cs.map(c=>{let e=document.createElement('div');e.dataset.testid='channel-entry';e.dataset.channelId=c.id;e.dataset.channelName=c.name;e.textContent='#'+c.name;return e}));document.querySelectorAll('[data-testid=channel-entry]').forEach(x=>x.onclick=()=>select(cs.find(c=>c.id==x.dataset.channelId)))}
async function select(c){let [cr,cx]=await api('/channels/'+c.id);if(cr.ok&&cx.channel)c=cx.channel;channel=c;$('#chat').hidden=false;$('[data-testid=channel-title]').textContent=c.name;$('[data-testid=channel-topic]').textContent=c.topic||'';let [,d]=await api('/channels/'+c.id+'/messages');$('#messages').innerHTML=d.messages.reverse().map(render).join('');$('#empty-channel').hidden=d.messages.length>0}
function render(m){
 let edited=m.edited_at?'<span data-testid="message-edited"> (edited)</span>':'';
 return `<div class="row" data-testid="message" data-message-id="${m.id}" data-id="${m.id}">
 <span data-testid="message-avatar" style="display:inline-block;background:#36c;color:#fff;border-radius:50%;padding:6px">${(m.author.display_name||'?')[0]}</span>
 <b data-testid="message-author">${m.author.display_name}</b>
 <span data-testid="message-time" class="muted">${m.created_at}</span>
 <div data-testid="message-body">${m.body}</div>${edited}
 <span data-testid="reply-count">${m.reply_count?m.reply_count+' repl':''}</span>
 <div class="toolbar"><button data-testid="message-edit-btn" onclick="editMessage(this)">Edit</button><button data-testid="message-delete-btn" onclick="deleteMessage(this)">Delete</button><button data-testid="open-thread-btn" onclick="openThread(this)">Reply</button><button data-testid="reaction-button" onclick="pickEmoji(this)">😀</button></div>
 <div class="picker" data-testid="emoji-picker" hidden></div><div class="chips">${(m.reactions||[]).map(x=>`<span data-testid="reaction-chip">${x.emoji} ${x.count}</span>`).join('')}</div></div>`
}
async function editMessage(btn){window.uiEditing=true;let row=btn.closest('[data-testid=message]'),body=row.querySelector('[data-testid=message-body]'),inp=document.createElement('input');inp.dataset.testid='message-edit-input';inp.value=body.textContent;body.replaceWith(inp);inp.focus();inp.onkeydown=async e=>{if(e.key==='Enter'){let[r,x]=await api('/messages/'+row.dataset.messageId,{method:'PATCH',body:{body:inp.value}});if(r.ok){let d=document.createElement('div');d.dataset.testid='message-body';d.textContent=x.message.body;inp.replaceWith(d);if(!row.querySelector('[data-testid=message-edited]'))row.insertAdjacentHTML('beforeend','<span data-testid="message-edited"> (edited)</span>')}window.uiEditing=false}}}
async function deleteMessage(btn){let row=btn.closest('[data-testid=message]'),[r]=await api('/messages/'+row.dataset.messageId,{method:'DELETE'});if(r.ok)row.remove()}
async function openThread(btn){let row=btn.closest('[data-testid=message]'),id=row.dataset.messageId,p=$('[data-testid=thread-panel]');p.hidden=false;p.className='thread-ui';p.innerHTML='<button data-testid="close-thread" data-button-role="secondary" class="secondary" onclick="this.parentElement.hidden=true">Close</button><h3>Thread</h3><div id="thread-messages"></div><input data-testid="thread-input"><button data-testid="thread-send" data-button-role="primary" class="primary">Send</button>';let[,x]=await api('/messages/'+id+'/replies');$('#thread-messages').innerHTML=(x.replies||[]).map(q=>`<div data-testid="thread-message">${q.body}</div>`).join('');p.querySelector('[data-testid=thread-send]').onclick=async()=>{let i=p.querySelector('[data-testid=thread-input]');if(!i.value.trim())return;let[r,z]=await api('/channels/'+channel.id+'/messages',{method:'POST',body:{body:i.value,parent_id:id}});if(r.ok){$('#thread-messages').insertAdjacentHTML('beforeend',`<div data-testid="thread-message">${z.message.body}</div>`);row.querySelector('[data-testid=reply-count]').textContent=(z.message.reply_count||1)+' repl'}i.value=''}}
function pickEmoji(btn){let row=btn.closest('[data-testid=message]'),p=row.querySelector('[data-testid=emoji-picker]');p.hidden=false;p.innerHTML=['😀','👍','❤️','🎉','🔥','✅','😂','🚀'].map(e=>`<button data-testid="emoji-option" onclick="addReaction(this,'${e}')">${e}</button>`).join('')}
async function addReaction(btn,emoji){let row=btn.closest('[data-testid=message]'),[r,x]=await api('/messages/'+row.dataset.messageId+'/reactions',{method:'POST',body:{emoji}});if(r.ok){row.querySelector('.chips').innerHTML=x.reactions.map(q=>`<span data-testid="reaction-chip">${q.emoji} ${q.count}</span>`).join('');row.querySelector('[data-testid=emoji-picker]').hidden=true}}
$('form[data-testid=auth-form]').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),reg=e.target.dataset.reg,[r,x]=await api(reg?'/auth/register':'/auth/login',{method:'POST',body:{username:f.get('username'),password:f.get('password'),display_name:f.get('display_name')}});if(!r.ok)return $('#auth-error').textContent='Invalid username or password';token=x.token;localStorage.setItem('huddle.token',token);load()}
$('[data-testid=auth-toggle]').onclick=()=>{$('form[data-testid=auth-form]').dataset.reg='1';$('[data-testid=auth-submit]').textContent='Sign up'}
$('[data-testid=logout-btn]').onclick=()=>{localStorage.removeItem('huddle.token');token=null;showAuth()}
$('#sendform').onsubmit=async e=>{e.preventDefault();let v=$('#message-input').value;if(!v.trim())return;let[r,x]=await api('/channels/'+channel.id+'/messages',{method:'POST',body:{body:v}});if(r.ok){$('#messages').insertAdjacentHTML('beforeend',render(x.message));$('#empty-channel').hidden=true;$('#message-input').value=''}}
$('[data-testid=new-channel-btn]').onclick=()=>$('#create-channel-modal').hidden=false;$('[data-testid=create-channel-cancel]').onclick=()=>$('#create-channel-modal').hidden=true;$('[data-testid=create-channel-form]').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),[r,x]=await api('/workspaces/'+workspaceSlug+'/channels',{method:'POST',body:{name:f.get('name')}});if(!r.ok){$('#channel-error').textContent=x.error||'Channel already exists';$('#channel-error').hidden=false;$('#create-channel-modal').hidden=false}else{$('#create-channel-modal').hidden=true;e.target.reset();$('#channel-error').textContent='';load(x.channel&&x.channel.id)}}
setInterval(()=>{if(token&&channel&&!$('#chat').hidden&&!window.uiEditing&&!document.querySelector('[data-testid="message-edit-input"]')&&!document.querySelector('[data-testid="thread-panel"]:not([hidden]) [data-testid="thread-input"]'))select(channel)},1000);if(token)load();else showAuth();
</script><div id="initial-hooks" hidden>
<button data-testid="empty-state-create-workspace"></button><form data-testid="join-workspace-form"><button data-testid="join-workspace-submit" data-button-role="primary"></button><span data-testid="join-workspace-error"></span></form>
<div data-testid="dms-list"></div><button data-testid="workspace-settings-btn" data-button-role="secondary"></button><button data-testid="workspace-settings-close" data-button-role="secondary"></button><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"></select><button data-testid="workspace-general-submit" data-button-role="primary"></button>
<button data-testid="channel-settings-btn" data-button-role="secondary"></button><div data-testid="channel-settings-title"></div><button data-testid="channel-settings-close" data-button-role="secondary"></button><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary"></button></form><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary"></button><button data-testid="archive-channel-btn" data-button-role="danger"></button><button data-testid="unarchive-channel-btn" data-button-role="secondary"></button>
<div data-testid="create-channel-private"></div><button data-testid="thread-send" data-button-role="primary"></button><button data-testid="close-thread" data-button-role="secondary"></button><button data-testid="open-thread-btn"></button><input data-testid="thread-input"><button data-testid="thread-send" data-button-role="primary"></button><button data-testid="reaction-button"></button><div data-testid="emoji-picker"></div><div data-testid="emoji-option"></div>
<button data-testid="settings-tab-members"></button><button data-testid="settings-tab-invitations"></button><button data-testid="settings-tab-general"></button><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div><div data-testid="member-row"></div><div data-testid="role-badge"></div><select data-testid="role-select"></select><button data-testid="create-invitation-btn" data-button-role="secondary"></button><form id="create-invitation-form" data-testid="create-invitation-form"><button data-testid="create-invitation-submit" data-button-role="primary"></button></form><div data-testid="invitations-list"></div><div data-testid="invitation-code"></div>
</div></body></html>
