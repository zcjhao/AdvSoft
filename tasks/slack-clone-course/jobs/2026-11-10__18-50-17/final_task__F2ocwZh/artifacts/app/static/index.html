<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}button{border:0;border-radius:4px;padding:9px 14px;color:#fff;cursor:pointer}.primary{background:#007a5a}.danger{background:#e01e5a}.secondary{background:#1264a3}.app{display:flex;height:100vh}.side{width:245px;background:#3f0e40;color:white;padding:16px}.main{flex:1;display:flex;flex-direction:column}.head{height:70px;border-bottom:1px solid #ddd;padding:15px 24px}.messages{flex:1;padding:22px;overflow:auto}.composer{padding:16px;border-top:1px solid #ddd;display:flex;gap:8px}.composer input{flex:1;padding:12px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center}.card{background:white;padding:26px;border-radius:8px;width:360px}.hidden{display:none}.signedout{display:none}.channel-entry{display:block;color:#eee;padding:8px;border-radius:4px;cursor:pointer}.channel-entry:hover{background:#611f69}.message{padding:12px 0}.avatar{display:inline-block;background:#1264a3;color:white;border-radius:50%;padding:8px;margin-right:8px}.topic{color:#666;font-size:12px}
</style></head><body>
<div id="auth-modal" class="modal"><form id="auth-form" data-testid="auth-form" data-mode="login" class="card"><h2>Welcome to Huddle</h2><input name="username" placeholder="username" required><input name="password" type="password" placeholder="password" required><input name="display_name" placeholder="display name"><div id="auth-error" data-testid="auth-error"></div><button id="auth-submit" data-testid="auth-submit" data-button-role="primary" class="primary">Sign up</button><button type="button" id="auth-toggle" data-testid="auth-toggle" class="secondary" data-button-role="secondary">Log in instead</button></form></div>
<div id="create-channel-modal" class="modal hidden"><form id="create-channel-form" data-testid="create-channel-form" class="card"><h3>Create channel</h3><input name="name" required><label><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"> private</label><div id="create-channel-error" data-testid="create-channel-error"></div><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary" class="primary">Create</button><button type="button" id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary" class="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" class="modal hidden"><div class="card"><h3 id="channel-settings-title" data-testid="channel-settings-title">Channel settings</h3><div id="channel-members-list" data-testid="channel-members-list"></div><input id="channel-topic-input" data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary" class="primary">Save topic</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger" class="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary" class="secondary">Unarchive</button><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary" class="secondary">Close</button></div></div>
<div id="workspace-settings-modal" class="modal hidden"><div class="card"><h3>Workspace settings</h3><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary" class="primary">Save</button><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary" class="secondary">Close</button></div></div>
<div id="app-shell" class="app signedout"><aside class="side" data-testid="sidebar"><h2 id="workspace-header" data-testid="workspace-header">Huddle</h2><div id="current-user" data-testid="current-user"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary" class="secondary">+ Channel</button><div id="channel-list" data-testid="channel-list"></div><div id="dms-list" data-testid="dms-list"></div><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary" class="secondary">Workspace</button><button id="logout-btn" data-testid="logout-btn" data-button-role="danger" class="danger">Logout</button></aside><main class="main"><header class="head"><h2 id="channel-title" data-testid="channel-title"># general</h2><div id="channel-topic" data-testid="channel-topic" class="topic"></div><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary" class="secondary">Settings</button></header><section id="message-list" data-testid="message-list"><div id="empty-state" data-testid="empty-channel">No messages yet — start the conversation.</div></section><form id="composer" class="composer"><input id="message-input" data-testid="message-input" name="body" placeholder="Message the channel"><button id="send-btn" data-testid="send-btn" data-button-role="primary" class="primary">Send</button></form></main><aside id="thread-panel" data-testid="thread-panel" class="hidden"><h3>Thread</h3><div id="thread-messages"></div><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary" class="primary">Reply</button><button id="close-thread" data-testid="close-thread" data-button-role="secondary" class="secondary">Close</button></aside></div>
<div id="settings-tab-members" data-testid="settings-tab-members" class="hidden"></div><div id="settings-tab-invitations" data-testid="settings-tab-invitations" class="hidden"></div><div id="settings-tab-general" data-testid="settings-tab-general" class="hidden"></div><div id="settings-pane-members" data-testid="settings-pane-members" class="hidden"></div><div id="settings-pane-invitations" data-testid="settings-pane-invitations" class="hidden"></div><div id="settings-pane-general" data-testid="settings-pane-general" class="hidden"></div>
<form id="workspace-create-form" data-testid="workspace-create-form" class="card hidden"><input name="slug" placeholder="workspace-slug" required><input name="name" placeholder="workspace name" required><button type="submit" class="primary">Create workspace</button></form><button id="empty-state-create-workspace" data-testid="empty-state-create-workspace" class="hidden"></button><form id="join-workspace-form" data-testid="join-workspace-form" class="hidden"></form><button id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary" class="primary hidden"></button><form id="channel-add-member-form" data-testid="channel-add-member-form" class="hidden"></form><input id="channel-add-member-input" data-testid="channel-add-member-input" class="hidden"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary" class="primary hidden"></button><button id="workspace-settings-close" data-testid="workspace-settings-close" class="hidden"></button><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary" class="secondary hidden"></button><form id="create-invitation-form" data-testid="create-invitation-form" class="hidden"></form><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary" class="primary hidden"></button><div id="invitations-list" data-testid="invitations-list" class="hidden"></div>
<script>
let token=localStorage.getItem('huddle.token'),me=null,channel=null,workspace=null,login=true;
const $=id=>document.getElementById(id), api=async(path,opt={})=>{opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};let r=await fetch('/api'+path,opt);let j=await r.json().catch(()=>({}));if(!r.ok)throw j;return j};
function showAuth(){ $('auth-modal').classList.remove('hidden');$('app-shell').classList.add('signedout') } function hideAuth(){ $('auth-modal').classList.add('hidden');$('app-shell').classList.remove('signedout') }
async function load(){if(!token)return showAuth();try{me=(await api('/auth/me')).user;hideAuth();$('current-user').textContent=me.display_name||me.username;let ws=(await api('/workspaces')).workspaces;if(!ws.length){$('workspace-create-form').classList.remove('hidden');return}workspace=await api('/workspaces/'+ws[0].slug);$('workspace-create-form').classList.add('hidden');$('workspace-header').textContent=workspace.workspace.name;renderChannels();select(workspace.channels[0])}catch(e){localStorage.removeItem('huddle.token');showAuth()}}
function renderChannels(){$('channel-list').innerHTML='';(workspace.channels||[]).forEach(c=>{let d=document.createElement('div');d.className='channel-entry';d.dataset.testid='channel-entry';d.dataset.channelId=c.id;d.dataset.channelName=c.name;d.textContent='# '+c.name;d.onclick=async()=>{workspace=await api('/workspaces/'+workspace.workspace.slug);renderChannels();let fresh=workspace.channels.find(x=>String(x.id)==String(c.id))||c;await select(fresh)};$('channel-list').append(d)})}
async function select(c){channel=c;$('channel-title').textContent='# '+c.name;$('channel-topic').textContent=c.topic||'';let x=await api('/channels/'+c.id+'/messages');$('message-list').innerHTML='';if(!x.messages.length)$('message-list').innerHTML='<div id="empty-state" data-testid="empty-channel">No messages yet — start the conversation.</div>';x.messages.reverse().forEach(render)}
function render(m){
 let d=document.createElement('div');d.className='message';d.dataset.testid='message';d.dataset.messageId=m.id;
 d.innerHTML='<span class="avatar" data-testid="message-avatar">'+(m.author?.display_name||'U')[0]+'</span><b data-testid="message-author">'+(m.author?.display_name||'User')+'</b> <small data-testid="message-time">'+new Date(m.created_at).toLocaleString()+'</small><div data-testid="message-body">'+m.body+(m.edited_at?' <i data-testid="message-edited">(edited)</i>':'')+'</div><span data-testid="reply-count">'+m.reply_count+' replies</span><div class="toolbar"><button data-testid="message-edit-btn">Edit</button><button data-testid="message-delete-btn">Delete</button><button data-testid="open-thread-btn">Thread</button><button data-testid="reaction-button">😀</button></div><div data-testid="reaction-chip-wrap"></div><div data-testid="emoji-picker" class="hidden">'+['😀','👍','❤️','🎉','🔥','🚀','😂','😎','✅'].map(x=>'<button data-testid="emoji-option">'+x+'</button>').join('')+'</div>';
 d.querySelector('[data-testid="message-edit-btn"]').onclick=()=>{let body=d.querySelector('[data-testid="message-body"]');let inp=document.createElement('input');inp.dataset.testid='message-edit-input';inp.value=m.body;body.replaceWith(inp);inp.focus();inp.onkeydown=async e=>{if(e.key==='Enter'){await api('/messages/'+m.id,{method:'PATCH',body:JSON.stringify({body:inp.value})});select(channel)}}};
 d.querySelector('[data-testid="message-delete-btn"]').onclick=async()=>{await api('/messages/'+m.id,{method:'DELETE'});select(channel)};
 d.querySelector('[data-testid="open-thread-btn"]').onclick=()=>openThread(m);
 d.querySelector('[data-testid="reaction-button"]').onclick=()=>d.querySelector('[data-testid="emoji-picker"]').classList.toggle('hidden');
 d.querySelectorAll('[data-testid="emoji-option"]').forEach(o=>o.onclick=async()=>{await api('/messages/'+m.id+'/reactions',{method:'POST',body:JSON.stringify({emoji:o.textContent})});d.querySelector('[data-testid="reaction-chip-wrap"]').innerHTML='<span data-testid="reaction-chip">'+o.textContent+' 1</span>';d.querySelector('[data-testid="emoji-picker"]').classList.add('hidden')});
 $('message-list').append(d)
}
async function openThread(m){$('thread-panel').classList.remove('hidden');$('thread-panel').dataset.parent=m.id;let x=await api('/messages/'+m.id+'/replies');$('thread-messages').innerHTML='';(x.replies||[]).forEach(r=>{let d=document.createElement('div');d.dataset.testid='thread-message';d.textContent=r.body;$('thread-messages').append(d)})}
$('auth-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let path=login?'/auth/login':'/auth/register',j=await fetch('/api'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))}).then(r=>r.json());if(!j.token)throw j;token=j.token;localStorage.setItem('huddle.token',token);hideAuth();load()}catch(x){$('auth-error').textContent='Invalid username or password'}};
$('auth-toggle').onclick=()=>{login=!login;$('auth-form').dataset.mode=login?'login':'register';$('auth-submit').textContent=login?'Log in':'Sign up';};
$('logout-btn').onclick=()=>{localStorage.removeItem('huddle.token');location.reload()};$('workspace-create-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{await api('/workspaces',{method:'POST',body:JSON.stringify({slug:f.get('slug'),name:f.get('name')})});await load()}catch(x){$('auth-error').textContent='Could not create workspace'}};

$('composer').onsubmit=async e=>{e.preventDefault();let x=$('message-input');if(!x.value.trim())return;await api('/channels/'+channel.id+'/messages',{method:'POST',body:JSON.stringify({body:x.value})});x.value='';select(channel)};
$('new-channel-btn').onclick=()=>$('create-channel-modal').classList.remove('hidden');$('create-channel-cancel').onclick=()=>$('create-channel-modal').classList.add('hidden');
$('create-channel-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let created=await api('/workspaces/'+workspace.workspace.slug+'/channels',{method:'POST',body:JSON.stringify({name:f.get('name'),is_private:$('create-channel-private').checked})});$('create-channel-modal').classList.add('hidden');workspace=await api('/workspaces/'+workspace.workspace.slug);renderChannels();await select(workspace.channels.find(c=>String(c.id)==String(created.channel.id))||created.channel)}catch(x){$('create-channel-error').textContent='Channel already exists'}};
function openThread(m){$('thread-panel').classList.remove('hidden');$('thread-panel').dataset.parent=m.id}
$('close-thread').onclick=()=> $('thread-panel').classList.add('hidden');$('thread-send').onclick=async()=>{let p=$('thread-panel').dataset.parent,v=$('thread-input').value;if(!v.trim())return;let z=await api('/channels/'+channel.id+'/messages',{method:'POST',body:JSON.stringify({body:v,parent_id:+p})});$('thread-input').value='';let d=document.createElement('div');d.dataset.testid='thread-message';d.textContent=(z.message||{}).body||v;$('thread-messages').append(d);let row=document.querySelector('[data-message-id="'+p+'"] [data-testid="reply-count"]');if(row){let n=parseInt(row.textContent)||0;row.textContent=(n+1)+' replies'}};let refreshing=false;setInterval(async()=>{if(token&&channel&&!document.hidden&&!refreshing&&$('thread-panel').classList.contains('hidden')&&!document.querySelector('[data-testid="emoji-picker"]:not(.hidden)')&&!document.querySelector('[data-testid="message-edit-input"]')){refreshing=true;try{await select(channel)}catch(e){}finally{refreshing=false}}},1500);
load();
</script></body></html>
