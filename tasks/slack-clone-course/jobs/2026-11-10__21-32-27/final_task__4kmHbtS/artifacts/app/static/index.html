<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222;background:#fff}.app{display:flex;height:100vh}.sidebar{width:260px;background:#3f0e40;color:#fff;padding:18px}.main{flex:1;padding:24px}.thread{width:340px;border-left:1px solid #ddd;padding:18px}button{border:0;border-radius:4px;padding:9px 14px;cursor:pointer}[data-button-role=primary]{background-color:#007a5a;color:#fff}[data-button-role=danger]{background-color:#e01e5a;color:#fff}[data-button-role=secondary]{background-color:#1264a3;color:#fff}input,textarea,select{padding:9px;border:1px solid #bbb;border-radius:4px;margin:4px 0}.modal{position:fixed;inset:15%;background:#fff;border:1px solid #bbb;padding:25px;box-shadow:0 4px 20px #555}.hidden{display:none!important}#channel-list button{display:block;width:100%;text-align:left;background:none;color:#fff;margin:3px 0}#message-list{min-height:250px}.row{padding:10px;border-bottom:1px solid #eee}.error{color:#c00;min-height:20px}
</style></head><body>
<div id="auth-modal" class="modal"><form id="auth-form" data-testid="auth-form"><h2>Sign in to Huddle</h2><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><input name="display_name" placeholder="Display name"><div id="auth-error" data-testid="auth-error" class="error"></div><button type="submit" id="auth-submit" data-testid="auth-submit" data-button-role="primary">Sign in</button><button type="button" id="auth-toggle" data-testid="auth-toggle">Create account</button></form></div>
<form id="workspace-create-form" data-testid="workspace-create-form" hidden><input name="slug"><input name="name"><button type="submit">Create workspace</button></form>
<form id="join-workspace-form" data-testid="join-workspace-form" hidden><input name="slug"><button id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary">Join workspace</button><div id="join-workspace-error" data-testid="join-workspace-error"></div></form>
<div id="empty-state-create-workspace" data-testid="empty-state-create-workspace" hidden>Create a workspace</div>
<div class="app" id="app" hidden><aside class="sidebar" id="sidebar" data-testid="sidebar"><h2 id="workspace-header" data-testid="workspace-header">Huddle</h2><div id="current-user" data-testid="current-user"></div><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Log out</button><h3>Channels</h3><div id="channel-list" data-testid="channel-list"></div><div id="dms-list" data-testid="dms-list"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button></aside>
<main class="main"><div><h1 id="channel-title" data-testid="channel-title">Select a channel</h1><span id="channel-topic" data-testid="channel-topic"></span><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button></div><div id="message-list" data-testid="message-list" hidden></div><div id="empty-state" hidden>No messages yet. Start the conversation.</div><form id="send-form"><input id="message-input" data-testid="message-input" name="body" placeholder="Message"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></form></main>
<aside id="thread-panel" data-testid="thread-panel" class="thread" hidden><h2>Thread</h2><div id="thread-messages"></div><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary">Reply</button><button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close</button></aside></div>
<div id="create-channel-modal" class="modal" hidden><form id="create-channel-form" data-testid="create-channel-form"><h2>Create channel</h2><input name="name"><label><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"> Private</label><div id="create-channel-error" data-testid="create-channel-error" class="error"></div><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button type="button" id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" class="modal" hidden><h2 id="channel-settings-title" data-testid="channel-settings-title">Channel settings</h2><div id="channel-members-list" data-testid="channel-members-list"></div><form id="channel-add-member-form" data-testid="channel-add-member-form"><input id="channel-add-member-input" data-testid="channel-add-member-input"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary">Add member</button></form><input id="channel-topic-input" data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button></div>
<div id="workspace-settings-modal" class="modal" hidden><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary">Save</button><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button><button id="settings-tab-members" data-testid="settings-tab-members">Members</button><button id="settings-tab-invitations" data-testid="settings-tab-invitations">Invitations</button><button id="settings-tab-general" data-testid="settings-tab-general">General</button><div id="settings-pane-members" data-testid="settings-pane-members"></div><div id="settings-pane-invitations" data-testid="settings-pane-invitations"></div><div id="settings-pane-general" data-testid="settings-pane-general"></div><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button><div id="invitations-list" data-testid="invitations-list"></div></form></div>
<script>
let token=localStorage.getItem('huddle.token')||new URLSearchParams(location.search).get('token'), me=null, ws=null, channels=[], current=null;
const $=id=>document.getElementById(id), api=async(method,path,body)=>{let o={method,headers:{Authorization:'Bearer '+token}};if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)};let r=await fetch('/api'+path,o);let d={};try{d=await r.json()}catch(e){}return {status:r.status,data:d}};
function showAuth(){ $('auth-modal').hidden=false;$('app').hidden=true }
function showApp(){ $('auth-modal').hidden=true;$('app').hidden=false }
async function boot(){
 if(!token){showAuth();return} localStorage.setItem('huddle.token',token);
 let r=await api('GET','/auth/me');if(r.status!==200){showAuth();return}me=r.data.user;showApp();$('current-user').textContent=me.username;
 let q=await api('GET','/workspaces'); if(!q.data.workspaces||!q.data.workspaces.length){$('empty-state-create-workspace').hidden=false;$('workspace-create-form').hidden=false;$('join-workspace-form').hidden=false;return}
 ws=q.data.workspaces[0]; $('workspace-header').textContent=ws.name; let d=await api('GET','/workspaces/'+ws.slug);channels=d.data.channels||[];renderSidebar();let g=channels.find(x=>x.name==='general')||channels[0];if(g)selectChannel(g.id)
}
function renderSidebar(){let box=$('channel-list');box.innerHTML='';channels.forEach(c=>{let x=document.createElement('button');x.className='channel-entry';x.dataset.testid='channel-entry';x.dataset.channelId=c.id;x.dataset.channelName=c.name;x.textContent='# '+c.name;x.onclick=()=>selectChannel(c.id);box.appendChild(x)})}
function renderMessage(m){
 let x=document.createElement('div');x.className='row';x.dataset.testid='message';x.dataset.messageId=m.id;
 let initial=(m.author.display_name||m.author.username||'?')[0].toUpperCase(), time=new Date(m.created_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
 x.innerHTML='<span data-testid="message-avatar" style="display:inline-block;background:#36c;color:white;border-radius:50%;width:28px;height:28px;text-align:center;padding-top:6px">'+initial+'</span> <b data-testid="message-author">'+(m.author.display_name||m.author.username)+'</b> <time data-testid="message-time" title="'+m.created_at+'">'+time+'</time><div data-testid="message-body"></div><div class="toolbar" style="display:none"><button data-testid="open-thread-btn">Thread</button><button data-testid="reaction-button">React</button>'+(m.author_id==me.id?'<button data-testid="message-edit-btn">Edit</button><button data-testid="message-delete-btn">Delete</button>':'')+'</div>';
 x.querySelector('[data-testid="message-body"]').textContent=m.body;
 if(m.edited_at){let z=document.createElement('span');z.dataset.testid='message-edited';z.textContent=' (edited)';x.querySelector('[data-testid="message-body"]').appendChild(z)}
 if(m.reply_count){let z=document.createElement('span');z.dataset.testid='reply-count';z.textContent=' '+m.reply_count+' '+(m.reply_count==1?'reply':'replies');x.appendChild(z)}
 x.onmouseenter=()=>x.querySelector('.toolbar').style.display='block';x.onmouseleave=()=>x.querySelector('.toolbar').style.display='none';
 x.querySelector('[data-testid="open-thread-btn"]').onclick=()=>openThread(m.id);
 x.querySelector('[data-testid="message-delete-btn"]')?.addEventListener('click',async()=>{await api('DELETE','/messages/'+m.id);selectChannel(current.id)});
 x.querySelector('[data-testid="message-edit-btn"]')?.addEventListener('click',()=>{let body=x.querySelector('[data-testid="message-body"]'),old=m.body;body.innerHTML='<input data-testid="message-edit-input" value="'+old.replace(/"/g,'&quot;')+'"><button data-testid="message-edit-save">Save</button>';let i=body.querySelector('input');i.focus();let save=async()=>{let r=await api('PATCH','/messages/'+m.id,{body:i.value});if(r.status===200)selectChannel(current.id)};i.onkeydown=e=>{if(e.key==='Enter')save();if(e.key==='Escape')selectChannel(current.id)};body.querySelector('button').onclick=save});
 x.querySelector('[data-testid="reaction-button"]').onclick=()=>{let old=x.querySelector('[data-testid="emoji-picker"]');if(old)old.remove();let pick=document.createElement('div');pick.dataset.testid='emoji-picker';pick.style.display='grid';pick.style.gridTemplateColumns='repeat(4,30px)';['😀','👍','❤️','🎉','🔥','🚀','✅','😂'].forEach(e=>{let q=document.createElement('button');q.dataset.testid='emoji-option';q.dataset.emoji=e;q.textContent=e;q.onclick=async()=>{await api('POST','/messages/'+m.id+'/reactions',{emoji:e});pick.remove();selectChannel(current.id)};pick.appendChild(q)});x.appendChild(pick)};
 (m.reactions||[]).forEach(r=>{let z=document.createElement('button');z.dataset.testid='reaction-chip';z.dataset.emoji=r.emoji;z.textContent=r.emoji+' '+r.count;z.onclick=async()=>{await api('DELETE','/messages/'+m.id+'/reactions/'+encodeURIComponent(r.emoji));selectChannel(current.id)};x.appendChild(z)});
 return x
}
async function selectChannel(id){if(ws){let fresh=await api('GET','/workspaces/'+ws.slug);if(fresh.status===200){channels=fresh.data.channels||channels;renderSidebar()}}current=channels.find(c=>String(c.id)===String(id));if(!current)return;$('channel-title').textContent='# '+current.name;$('channel-topic').textContent=current.topic||'';$('message-list').hidden=false;let r=await api('GET','/channels/'+id+'/messages'),box=$('message-list');box.innerHTML='';if(!r.data.messages||!r.data.messages.length){let e=document.createElement('div');e.dataset.testid='empty-channel';e.textContent='No messages yet. Say hello!';box.appendChild(e)}else r.data.messages.slice().reverse().forEach(m=>box.appendChild(renderMessage(m)));connectSocket()}
async function openThread(id){let p=await api('GET','/messages/'+id+'/replies');$('thread-panel').hidden=false;$('thread-panel').dataset.parentId=id;let box=$('thread-messages');box.innerHTML='';(p.data.replies||[]).forEach(m=>{let x=document.createElement('div');x.dataset.testid='thread-message';x.textContent=m.body;box.appendChild(x)})}
function connectSocket(){if(window.huddleWS)try{window.huddleWS.close()}catch(e){};if(!current||!token)return;let u=(location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/api/ws?token='+encodeURIComponent(token);let w=new WebSocket(u);window.huddleWS=w;w.onopen=()=>w.send(JSON.stringify({type:'subscribe',channel_id:current.id}));w.onmessage=e=>{let f=JSON.parse(e.data);if(f.channel_id==current.id&&f.type&&f.type.startsWith('message.'))selectChannel(current.id)}}
$('auth-toggle').onclick=()=>{let f=$('auth-form');f.dataset.mode=f.dataset.mode==='register'?'login':'register';$('auth-submit').textContent=f.dataset.mode==='register'?'Sign up':'Sign in'}
$('auth-form').dataset.mode='login';
$('auth-form').onsubmit=async e=>{e.preventDefault();let f=e.target,d=Object.fromEntries(new FormData(f)),mode=f.dataset.mode||'login';let r=await fetch('/api/auth/'+(mode==='register'?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),x={};try{x=await r.json()}catch(z){}if(!r.ok){$('auth-error').textContent=x.message||'Invalid credentials';return}token=x.token;localStorage.setItem('huddle.token',token);$('auth-error').textContent='';await boot()};
$('workspace-create-form').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),r=await api('POST','/workspaces',{slug:d.slug,name:d.name});if(r.status===201){ws=r.data.workspace;$('empty-state-create-workspace').hidden=true;$('workspace-header').textContent=ws.name;let q=await api('GET','/workspaces/'+ws.slug);channels=q.data.channels;renderSidebar();selectChannel(channels[0].id)}};
$('new-channel-btn').onclick=()=>{$('create-channel-modal').hidden=false};$('create-channel-cancel').onclick=()=>{$('create-channel-modal').hidden=true};
$('create-channel-form').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.is_private=$('create-channel-private').checked;let r=await api('POST','/workspaces/'+ws.slug+'/channels',d);if(r.status!==201){$('create-channel-error').textContent='Channel name already exists';return}channels.push(r.data.channel);renderSidebar();$('create-channel-modal').hidden=true;selectChannel(r.data.channel.id)};
$('logout-btn').onclick=()=>{localStorage.removeItem('huddle.token');token=null;showAuth()};
$('send-form').onsubmit=async e=>{e.preventDefault();if(!current)return;let i=$('message-input');if(!i.value.trim())return;let r=await api('POST','/channels/'+current.id+'/messages',{body:i.value});if(r.status===201){i.value='';selectChannel(current.id)}};
$('thread-send').onclick=async()=>{let i=$('thread-input'),id=$('thread-panel').dataset.parentId;if(!id||!i.value.trim())return;let r=await api('POST','/channels/'+current.id+'/messages',{body:i.value,parent_id:Number(id)});if(r.status===201){i.value='';openThread(id);selectChannel(current.id)}};
$('close-thread').onclick=()=>{$('thread-panel').hidden=true};
boot();
</script></body></html>
