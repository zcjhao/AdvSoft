<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}button{padding:8px 12px;border:0;border-radius:4px}[data-button-role=primary]{background-color:#007a5a!important;color:#fff!important}[data-button-role=danger]{background-color:#e01e5a!important;color:#fff!important}[data-button-role=secondary]{background-color:#1264a3!important;color:#fff!important}[hidden]{display:none!important}#app{display:flex;height:100vh}.sidebar{width:240px;background:#3f0e40;color:white;padding:16px}.main{display:flex;flex:1}.column{display:flex;flex-direction:column;flex:1}.top{padding:16px;border-bottom:1px solid #ddd}.messages{flex:1;overflow:auto;padding:16px}.message{display:flex;gap:10px;padding:10px;position:relative}.message:hover{background:#f5f5f5}.avatar{background:#1264a3;color:white;padding:10px;border-radius:4px}.body{margin-top:5px}.toolbar{display:none;position:absolute;right:5px}.message:hover .toolbar{display:block}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #ddd}.composer input{flex:1;padding:10px}.thread{width:330px;padding:15px;border-left:1px solid #ddd}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center}.box{background:#fff;padding:25px;min-width:320px}.box input{display:block;padding:9px;margin:8px 0;width:100%}.error{color:#c00}.channel-entry{padding:9px;cursor:pointer}.picker{position:absolute;background:#fff;border:1px solid #aaa;padding:8px;display:grid;grid-template-columns:repeat(4,1fr)}.empty{text-align:center;padding:40px;color:#777}
</style></head><body>
<div id="auth-modal" class="modal"><form id="auth-form" data-testid="auth-form" data-mode="login" class="box"><h2>Huddle</h2><input name="username" placeholder="Username"><input name="password" type="password" placeholder="Password"><input name="display_name" class="regonly" placeholder="Display name" hidden><div id="auth-error" data-testid="auth-error" class="error"></div><button id="auth-submit" data-testid="auth-submit" data-button-role="primary">Log in</button><button type="button" id="auth-toggle" data-testid="auth-toggle">Create account</button></form></div>
<div id="app" hidden><aside id="sidebar" class="sidebar" data-testid="sidebar"><div id="workspace-header" data-testid="workspace-header"></div><div id="current-user" data-testid="current-user"></div><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Workspace</button><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button><div id="channel-list" data-testid="channel-list"></div><div id="dms-list" data-testid="dms-list"></div><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Logout</button><div id="empty-state-create-workspace" data-testid="empty-state-create-workspace" hidden><form id="workspace-create-form" data-testid="workspace-create-form"><input name="slug"><input name="name"><button type="submit" data-testid="workspace-general-submit" data-button-role="primary">Create</button></form><form id="join-workspace-form" data-testid="join-workspace-form"><input name="code"><button id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary">Join</button></form><div id="join-workspace-error" data-testid="join-workspace-error"></div></div></aside><main class="main"><section class="column"><header class="top"><b id="channel-title" data-testid="channel-title"></b> <span id="channel-topic" data-testid="channel-topic"></span><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Settings</button></header><div id="message-list" data-testid="message-list" class="messages"></div><form id="composer" class="composer"><input id="message-input" data-testid="message-input"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></form></section><aside id="thread-panel" data-testid="thread-panel" class="thread" hidden><button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close</button><div id="thread-content"></div><form id="thread-form"><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary">Reply</button></form></aside></main></div>
<div id="create-channel-modal" class="modal" hidden><form id="create-channel-form" data-testid="create-channel-form" class="box"><input name="name"><label><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"> Private</label><div id="create-channel-error" data-testid="create-channel-error" class="error"></div><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button type="button" id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" hidden><div id="channel-settings-title" data-testid="channel-settings-title"></div><div id="channel-members-list" data-testid="channel-members-list"></div><form id="channel-add-member-form" data-testid="channel-add-member-form"><input id="channel-add-member-input" data-testid="channel-add-member-input"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary">Add</button></form><input id="channel-topic-input" data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button></div>
<div id="workspace-settings-modal" hidden><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button><button id="settings-tab-members" data-testid="settings-tab-members">Members</button><button id="settings-tab-invitations" data-testid="settings-tab-invitations">Invitations</button><button id="settings-tab-general" data-testid="settings-tab-general">General</button><div id="settings-pane-members" data-testid="settings-pane-members"></div><div id="settings-pane-invitations" data-testid="settings-pane-invitations"></div><div id="settings-pane-general" data-testid="settings-pane-general"></div><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button></form><div id="invitations-list" data-testid="invitations-list"></div></div>
<script>
let token=localStorage.getItem('huddle.token'),me,ws,current,thread;
const $=x=>document.getElementById(x),api=async(m,p,b)=>{let r=await fetch(p,{method:m,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}),d={};try{d=await r.json()}catch{}return{r:r.status,d}};
function auth(){ $('auth-modal').hidden=false;$('app').hidden=true }function showApp(){ $('auth-modal').hidden=true;$('app').hidden=false;loadWorkspace()}
async function loadWorkspace(){let x=await api('GET','/api/workspaces');if(!x.d.workspaces?.length){$('empty-state-create-workspace').hidden=false;return}ws=x.d.workspaces[0];$('workspace-header').textContent=ws.name;let d=(await api('GET','/api/workspaces/'+ws.slug)).d;let cs=d.channels||[];$('channel-list').innerHTML=cs.map(c=>`<div class="channel-entry" data-testid="channel-entry" data-channel-id="${c.id}" data-channel-name="${c.name}" onclick="select(${c.id})"># ${c.name}</div>`).join('');let g=cs.find(c=>c.name==='general')||cs[0];if(g)select(g.id)}
let socket=null;let socketChannel=null;let refreshTimer=setInterval(async()=>{if(token&&current&&document.visibilityState!=='hidden'){try{let z=await api('GET','/api/channels/'+current+'/messages');if(z.r<300)renderMessages((z.d.messages||[]).slice().reverse())}catch(e){}}},700);function connect(){if(socket)try{socket.close()}catch(e){};socketChannel=current;socket=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/api/ws?token='+encodeURIComponent(token));socket.onopen=()=>{if(socketChannel==current)socket.send(JSON.stringify({type:'subscribe',channel_id:current}))};socket.onmessage=e=>{try{let f=JSON.parse(e.data);if(f.channel_id==current&&f.event_id&&f.type!=='subscribed')select(current)}catch(err){}};socket.onclose=()=>{if(socketChannel==current&&token)setTimeout(()=>{if(socketChannel==current)connect()},150)}}
function renderMessages(ms){$('message-list').innerHTML=ms.length?ms.map(render).join(''):'<div class="empty" data-testid="empty-channel">No messages yet. Say hello!</div>'}
async function select(id){current=id;let d=(await api('GET','/api/workspaces/'+ws.slug)).d,c=d.channels.find(x=>x.id==id);$('channel-title').textContent='# '+c.name;$('channel-topic').textContent=c.topic||'';let ms=(await api('GET','/api/channels/'+id+'/messages')).d.messages||[];renderMessages(ms.reverse())};connect()
function render(m){let chips=(m.reactions||[]).map(r=>`<button class="reaction-chip" data-testid="reaction-chip" data-emoji="${r.emoji}" onclick="react(${m.id},'${r.emoji}',true)">${r.emoji} ${r.count}</button>`).join('');let replies=m.reply_count?`<button data-testid="reply-count" onclick="threadOpen(${m.id})">${m.reply_count} ${m.reply_count==1?'reply':'replies'}</button>`:'';return `<div class="message" data-testid="message" data-message-id="${m.id}"><div class="avatar" data-testid="message-avatar">${(m.author.display_name||'?')[0]}</div><div><b data-testid="message-author">${m.author.display_name}</b><small class="time" data-testid="message-time" title="${m.created_at}">${new Date(m.created_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</small><div class="body" data-testid="message-body">${m.body}</div>${m.edited_at?'<small data-testid="message-edited" class="message-edited">(edited)</small>':''}${replies}<div>${chips}</div></div><div class="toolbar"><button data-testid="open-thread-btn" onclick="threadOpen(${m.id})">Thread</button><button data-testid="reaction-button" onclick="picker(${m.id})">😀</button>${m.author_id==me.id?`<button data-testid="message-edit-btn" onclick="edit(${m.id})">Edit</button><button data-testid="message-delete-btn" onclick="del(${m.id})">Delete</button>`:''}</div></div>`}

async function send(parent){let e=parent?$('thread-input'):$('message-input'),v=e.value.trim();if(!v)return;let x=await api('POST','/api/channels/'+current+'/messages',{body:v,...parent?{parent_id:parent}:{}});if(x.r<300){e.value='';if(parent){await select(current);await threadOpen(parent)}else await select(current)}}
async function edit(id,v){let r=document.querySelector(`[data-message-id="${id}"]`),body=r.querySelector('[data-testid="message-body"]');v=v===undefined?body.textContent:v;body.outerHTML=`<input data-testid="message-edit-input" value="${String(v).replaceAll('"','&quot;')}" onkeydown="if(event.key==='Enter')saveEdit(${id},this.value);if(event.key==='Escape')select(current)">`}
async function saveEdit(id,v){if(v.trim()){await api('PATCH','/api/messages/'+id,{body:v});select(current)}}async function del(id){await api('DELETE','/api/messages/'+id);select(current)}async function react(id){await api('POST','/api/messages/'+id+'/reactions',{emoji:'😀'});select(current)}function picker(id){let r=document.querySelector(`[data-message-id="${id}"]`),p=document.createElement('div');p.className='picker';p.dataset.testid='emoji-picker';['😀','👍','❤️','🎉','🚀','😂','😮','👏'].forEach(e=>{let b=document.createElement('button');b.dataset.testid='emoji-option';b.dataset.emoji=e;b.textContent=e;b.onclick=()=>{react(id,e);p.remove()};p.append(b)});r.append(p)}
async function threadOpen(id){thread=id;$('thread-panel').hidden=false;let x=(await api('GET','/api/messages/'+id+'/replies')).d;$('thread-content').innerHTML=(x.replies||[]).map(m=>`<div data-testid="thread-message">${m.body}</div>`).join('')}
$('auth-toggle').onclick=()=>{$('auth-form').dataset.mode=$('auth-form').dataset.mode==='login'?'register':'login';document.querySelector('.regonly').hidden=$('auth-form').dataset.mode==='login'}
$('auth-form').onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(e.target)),x=await api('POST','/api/auth/'+(e.target.dataset.mode==='register'?'register':'login'),b);if(x.r>=300){$('auth-error').textContent=x.d.error||'Invalid';return}token=x.d.token;localStorage.setItem('huddle.token',token);me=x.d.user;$('current-user').textContent=me.username;showApp()}
$('workspace-create-form').onsubmit=async e=>{e.preventDefault();let x=await api('POST','/api/workspaces',Object.fromEntries(new FormData(e.target)));if(x.r>=300){return}ws=x.d.workspace;$('empty-state-create-workspace').hidden=true;$('workspace-header').textContent=ws.name;let d=(await api('GET','/api/workspaces/'+ws.slug)).d;let cs=d.channels||[];if(x.d.general_channel&&!cs.some(c=>c.id==x.d.general_channel.id))cs.unshift(x.d.general_channel);$('channel-list').innerHTML=cs.map(c=>`<div class="channel-entry" data-testid="channel-entry" data-channel-id="${c.id}" data-channel-name="${c.name}" onclick="select(${c.id})"># ${c.name}</div>`).join('');if(cs[0])select(cs[0].id)}
$('new-channel-btn').onclick=()=>{$('create-channel-modal').hidden=false};$('create-channel-cancel').onclick=()=>{$('create-channel-modal').hidden=true};$('create-channel-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),x=await api('POST','/api/workspaces/'+ws.slug+'/channels',{name:f.get('name'),is_private:$('create-channel-private').checked});if(x.r>=300){$('create-channel-error').textContent=(x.d&&x.d.error)||('Unable to create channel (HTTP '+x.r+')');$('create-channel-error').style.display='block';$('create-channel-modal').hidden=false;return}$('create-channel-error').textContent='';$('create-channel-modal').hidden=true;let d=(await api('GET','/api/workspaces/'+ws.slug)).d;let cs=d.channels||[];if(x.d.channel&&!cs.some(c=>c.id==x.d.channel.id))cs.push(x.d.channel);$('channel-list').innerHTML=cs.map(c=>`<div class="channel-entry" data-testid="channel-entry" data-channel-id="${c.id}" data-channel-name="${c.name}" onclick="select(${c.id})"># ${c.name}</div>`).join('');select(x.d.channel.id)}
$('composer').onsubmit=e=>{e.preventDefault();send()};$('thread-form').onsubmit=e=>{e.preventDefault();send(thread)};$('close-thread').onclick=()=>{$('thread-panel').hidden=true};$('logout-btn').onclick=()=>{localStorage.removeItem('huddle.token');token=null;auth()}
(async()=>{if(!token)return auth();let x=await api('GET','/api/auth/me');if(x.r<300){me=x.d.user;$('auth-modal').hidden=true;$('app').hidden=false;loadWorkspace()}else auth()})();
</script></body></html>
